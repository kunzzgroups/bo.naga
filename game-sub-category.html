<body class="report-body standardized-game-management page-game-sub-category bo-charcoal bo-account-chip">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand">
<div>Backoffice<br/><small>Admin Panel</small></div>
<button class="close-side" data-close-sidebar=""><i class="bi bi-x-lg"></i></button>
</div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar="" id="reportOverlay"></div>
<main class="report-main">
<header class="report-topbar">
<button class="hamb" data-open-sidebar=""><i class="bi bi-list"></i></button>
<div class="user-title-wrap">
<div class="user-title-icon"><i class="bi bi-diagram-3"></i></div>
<div>
<h1>Game Sub Category Management</h1>
</div>
</div>
<div class="report-actions">
  <button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">
    <i class="bi bi-sun-fill" data-theme-icon="sun"></i>
    <i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i>
  </button>
  <div data-bo-profile></div>
</div>
</header>
<section class="report-content">
<div class="manage-page-grid crud-list-only-grid">
<div class="manage-list-card subcategory-modern-page crud-list-full">
<div class="section-title slider-list-title subcategory-toolbar-title">
<div class="subcategory-toolbar-controls">
<select class="manage-filter-select" id="subCategoryFilter" aria-label="Filter by category"></select>
</div>
<div class="crud-title-actions subcategory-toolbar-actions">
<button class="mad-btn mad-btn-ghost clean-btn" id="refreshSubCategoryBtn" type="button"><i class="bi bi-arrow-clockwise" aria-hidden="true"></i><span class="btn-label">Refresh</span></button>
<a class="clean-btn primary mad-btn-primary" id="addSubCategoryBtn" href="game-sub-category-edit.html"><i class="bi bi-plus-lg" aria-hidden="true"></i><span>Add Game Sub Category</span></a>
</div>
</div>
<div class="upload-status" id="subCategoryStatusBox"></div>
<div class="slider-empty" hidden="" id="subCategoryEmpty">
<i class="bi bi-diagram-3"></i>
<b>No sub categories found</b>
<small>Create your first game sub category.</small>
</div>
<div class="subcategory-table-wrap">
<div class="subcategory-table-head"><span class="subcategory-head-name">SUB CATEGORY</span><span class="subcategory-head-status">STATUS</span><span class="subcategory-head-actions">ACTIONS</span></div>
<div class="manage-list subcategory-table" id="subCategoryList"></div>
</div>
<div class="table-footer">
<div class="entries-control"><span>Show</span><select id="subCategoryPageSize"><option value="10">10</option><option value="25">25</option><option value="50">50</option><option value="100">100</option></select><span>entries</span></div>
<span class="table-info" id="subCategoryShowingText">Showing 0 entries</span>
<div aria-label="Game sub category pagination" class="pagination-clean smart-pagination" id="subCategoryPagination" role="navigation"></div>
</div>
</div>
</div>
