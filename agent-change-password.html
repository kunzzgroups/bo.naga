<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Change Password</title>
<!-- Moved: the password form now lives on the profile page under id="password", which is where every
     BO page sends the account chip (bo-account-chip.js sets href to profile.html#password). This page
     stays as a redirect so existing links, the old menu entry and bookmarks keep working. -->
<script>
(function () {
  var q = location.search || '', h = location.hash || '';
  location.replace('agent-profile.html' + (h && h !== '#password' ? h : '#password'));
})();
</script>
</head>
<body class="report-body agent-report-body agent-modern bo-charcoal bo-account-chip" data-agent-page="profile">
<p>Redirecting to the profile page&rsquo;s Change Password section&hellip;</p>
</body>
</html>
