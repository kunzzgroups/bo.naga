<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Win/Lose Report</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link href="assets/css/reports.css?v=1.0.37" rel="stylesheet"/><link href="assets/css/table-pagination-horizontal.css?v=1.0.2" rel="stylesheet"/><link href="assets/css/bo-ui-standard.css?v=1.0.1" rel="stylesheet"/>
</head><body class="report-body standardized-listing-page">
<div class="report-shell"><aside class="report-sidebar" id="reportSidebar"><div class="report-brand"><div>Backoffice<br/><small>Admin Panel</small></div><button class="close-side" data-close-sidebar=""><i class="bi bi-x-lg"></i></button></div><nav class="report-nav"></nav></aside>
<div class="sidebar-overlay" data-close-sidebar="" id="reportOverlay"></div><main class="report-main">
<header class="report-topbar"><button class="hamb" data-open-sidebar=""><i class="bi bi-list"></i></button><div class="user-title-wrap"><div class="user-title-icon"><i class="bi bi-graph-up-arrow"></i></div><div><h1>Win/Lose Report</h1><p>Member betting performance by date, category, provider and VIP tier.</p></div></div><div class="report-actions" data-bo-profile=""></div></header>
<section class="report-content">
<div class="quick-stats"><div class="metric"><span>Total Bet</span><strong id="wlTotalBet">0.00</strong></div><div class="metric"><span>Valid Bet</span><strong id="wlValidBet">0.00</strong></div><div class="metric"><span>Win/Lose</span><strong id="wlWinLose">0.00</strong></div><div class="metric"><span>Members</span><strong id="wlMembers">0</strong></div></div>
<div class="filter-card"><div class="user-search-grid bo-filter-row">
<div class="field"><label>Date From</label><input id="wlFrom" type="date"/></div><div class="field"><label>Date To</label><input id="wlTo" type="date"/></div>
<div class="field"><label>Category</label><select id="wlCategory"><option value="">All Categories</option><option>LIVE</option><option>SPORT</option><option>SLOT</option><option>FISH</option></select></div>
<div class="field"><label>Game / Provider</label><select id="wlProvider"><option value="">All game providers under the category</option></select></div>
<div class="field"><label>VIP Tier</label><select id="wlVip"><option value="">All VIP Tiers</option></select></div>
<div class="field"><label> </label><div class="filter-action-row"><button class="clean-btn" id="wlReset"><i class="bi bi-arrow-clockwise"></i> Reset</button><button class="btn-primary-clean" id="wlSearch"><i class="bi bi-search"></i> Search</button></div></div>
</div></div>
<div class="table-card"><div class="table-wrap"><table class="report-table"><thead><tr><th>#</th><th>Username</th><th>VIP Tier</th><th>Total Bet</th><th>Valid Bet</th><th>Win/Lose</th></tr></thead><tbody id="wlBody"><tr><td colspan="6">Loading...</td></tr></tbody></table></div><div class="d-flex justify-content-between mt-3"><button class="clean-btn" id="wlPrev">Previous</button><span id="wlPager"></span><button class="clean-btn" id="wlNext">Next</button></div></div>
</section></main></div>
<script src="assets/js/config.js?v=1.0.32"></script><script src="assets/js/auth.js?v=1.0.33"></script><script src="assets/js/reports.js?v=1.0.14"></script><script src="assets/js/bo-date-range.js?v=1.0.10"></script><script src="assets/js/win-lose-report.js?v=1.0.1"></script><script src="assets/js/bo-ui-standard.js?v=1.0.0"></script>
<script src="assets/js/operation-global-notification.js?v=1.0.5"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-config.js?v=1.0.0"></script>
<script src="assets/js/livechat-global-notification.js?v=20260811-global-v3"></script>
