<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Brand Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="assets/css/reports.css?v=1.0.43" rel="stylesheet"/>
  <link href="assets/css/bo-ui-standard.css?v=1.0.3" rel="stylesheet"/>
  <link href="assets/css/brand-agent-standard.css?v=1.0.2" rel="stylesheet"/>
  <link href="assets/css/brand-detail-executive.css?v=1.0.0" rel="stylesheet"/>
</head>
<body class="report-body brand-agent-standard brand-detail-page" data-access-page="brand_management">
<div class="report-shell">
  <aside class="report-sidebar" id="reportSidebar">
    <div class="report-brand"><div>Backoffice<br/><small>Executive Panel</small></div><button class="close-side" data-close-sidebar><i class="bi bi-x-lg"></i></button></div>
    <nav class="report-nav"></nav>
  </aside>
  <div class="sidebar-overlay" data-close-sidebar></div>
  <main class="report-main">
    <header class="report-topbar brand-detail-topbar">
      <button class="hamb" data-open-sidebar><i class="bi bi-list"></i></button>
      <div></div>
      <div class="report-actions" data-bo-profile></div>
    </header>
    <section class="report-content brand-detail-content" id="brandDetailRoot">
      <div class="brand-detail-toolbar">
        <div class="brand-detail-breadcrumb"><a href="brand-management.html">Brands</a><i class="bi bi-chevron-right"></i><strong id="brandBreadcrumb">Brand</strong></div>
        <div class="brand-detail-actions">
          <button class="brand-detail-btn" id="brandDetailExport" type="button"><i class="bi bi-download"></i> Export</button>
          <button class="brand-detail-btn primary" id="brandDetailManage" type="button"><i class="bi bi-gear"></i> Manage Brand</button>
        </div>
      </div>

      <div class="brand-detail-identity">
        <div class="brand-detail-avatar" id="brandDetailAvatar">B</div>
        <div class="brand-detail-name-wrap">
          <div class="brand-detail-name-line"><h1 id="brandDetailName">Brand</h1><span class="brand-detail-status" id="brandDetailStatus">Active</span></div>
          <div class="brand-detail-meta"><span id="brandDetailCode">-</span><span>·</span><span id="brandDetailDomain">-</span></div>
        </div>
      </div>

      <div class="brand-detail-kpis">
        <div class="brand-detail-kpi"><span>Net Profit</span><strong class="blue" id="brandKpiProfit">0.00</strong></div>
        <div class="brand-detail-kpi"><span>Total Revenue</span><strong id="brandKpiRevenue">0.00</strong></div>
        <div class="brand-detail-kpi"><span>Vendor Cost</span><strong id="brandKpiVendorCost">0.00</strong></div>
        <div class="brand-detail-kpi"><span>Turnover</span><strong id="brandKpiTurnover">0.00</strong></div>
        <div class="brand-detail-kpi"><span>Bets Placed</span><strong id="brandKpiBets">0</strong></div>
        <div class="brand-detail-kpi"><span>Active Players</span><strong id="brandKpiPlayers">0</strong></div>
      </div>

      <div class="brand-detail-tabs" role="tablist">
        <button class="active" type="button" data-brand-tab="overview">Overview</button>
        <button type="button" data-brand-tab="transactions">Transactions</button>
        <button type="button" data-brand-tab="settlements">Settlement Records</button>
        <button type="button" data-brand-tab="adjustments">Adjustment Records <span class="brand-tab-count" id="brandAdjustmentCount" hidden>0</span></button>
      </div>

      <div class="brand-detail-card">
        <h2 id="brandRecordsTitle">Recent Records (Transactions / Settlements / Adjustments)</h2>
        <div class="brand-detail-table-wrap">
          <table class="brand-detail-table">
            <thead id="brandRecordsHead"><tr><th>Type</th><th>Description</th><th>Amount</th><th>Date</th><th>Status</th></tr></thead>
            <tbody id="brandRecordsRows"><tr><td colspan="5" class="brand-detail-empty">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
      <div class="brand-detail-footer">© 2026 Backoffice. All rights reserved.</div>
    </section>
  </main>
</div>
<script src="assets/js/config.js?v=1.0.36"></script>
<script src="assets/js/brand-context.js?v=1.0.4"></script>
<script src="assets/js/reports.js?v=1.0.17"></script>
<script src="assets/js/auth.js?v=1.0.53"></script>
<script src="assets/js/brand-detail-executive.js?v=1.0.0"></script>
<script src="assets/js/bo-ui-standard.js?v=1.0.0"></script>
</body>
</html>
