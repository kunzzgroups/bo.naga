<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bulk Bonus Adjustment</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="assets/css/reports.css?v=1.0.35" rel="stylesheet"><link href="assets/css/bo-ui-standard.css?v=1.0.1" rel="stylesheet"></head><body class="report-body"><div class="report-shell"><aside class="report-sidebar" id="reportSidebar"><div class="report-brand"><div>Backoffice<br><small>Admin Panel</small></div></div><nav class="report-nav"></nav></aside><main class="report-main"><header class="report-topbar"><button class="hamb" data-open-sidebar><i class="bi bi-list"></i></button><div class="user-title-wrap"><div class="user-title-icon"><i class="bi bi-gift"></i></div><div><h1>Bulk Bonus Adjustment</h1><p>Credit or debit bonus amounts for multiple members in one audited batch.</p></div></div><div class="report-actions" data-bo-profile></div></header><section class="report-content"><div class="table-card" style="max-width:900px"><div class="field"><label>Member IDs</label><textarea id="bulkMemberIds" rows="5" placeholder="Enter member IDs separated by comma, space or new line"></textarea></div><div class="row g-3 mt-1"><div class="col-md-4 field"><label>Type</label><select id="bulkType"><option value="CREDIT">Credit</option><option value="DEBIT">Debit</option></select></div><div class="col-md-4 field"><label>Amount per member</label><input id="bulkAmount" type="number" min="0.01" step="0.01"></div><div class="col-md-4 field"><label>Reason Code</label><input id="bulkReason" value="BONUS_ADJUSTMENT"></div></div><div class="field mt-3"><label>Remark</label><textarea id="bulkRemark" rows="3" required></textarea></div><button class="btn-primary-clean mt-3" id="bulkSubmit"><i class="bi bi-check2-circle"></i> Submit Bulk Bonus Adjustment</button><div id="bulkStatus" class="mt-3"></div></div></section></main></div><script src="assets/js/config.js?v=1.0.28"></script><script src="assets/js/reports.js?v=1.0.12"></script><script src="assets/js/auth.js?v=1.0.28"></script><script>document.addEventListener('DOMContentLoaded',()=>{document.getElementById('bulkSubmit').onclick=async()=>{const ids=[...new Set(document.getElementById('bulkMemberIds').value.split(/[\s,]+/).map(Number).filter(n=>Number.isInteger(n)&&n>0))],amount=Number(document.getElementById('bulkAmount').value),type=document.getElementById('bulkType').value,remark=document.getElementById('bulkRemark').value.trim(),reasonCode=document.getElementById('bulkReason').value.trim(),status=document.getElementById('bulkStatus');if(!ids.length||!amount||!remark){status.className='alert alert-danger mt-3';status.textContent='Member IDs, amount and remark are required.';return;}if(!confirm(`${type} ${amount.toFixed(2)} for ${ids.length} member(s)?`))return;try{const payload=memberIds:ids,amount:type==='DEBIT'?-amount:amount,reasonCode,remark;const r=await fetch(API_CONFIG.BASE_URL+'/admin/operations/bulk-bonus',{method:'POST',headers:{'Content-Type':'application/json',...BO_AUTH.authHeader()},body:JSON.stringify(payload)}),j=await r.json().catch(()=>({}));if(!r.ok||j.status==='error')throw new Error(j.message||'Request failed');status.className='alert alert-success mt-3';status.textContent=j.message||'Bulk Bonus Adjustment completed.';}catch(e){status.className='alert alert-danger mt-3';status.textContent=e.message;}};});</script></body></html>
