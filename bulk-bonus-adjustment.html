<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bulk Bonus Adjustment</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="assets/css/reports.css?v=1.0.31" rel="stylesheet"><link href="assets/css/bo-ui-standard.css?v=1.0.1" rel="stylesheet"><link href="assets/css/bulk-member-operation.css?v=1.0.0" rel="stylesheet"></head>
<body class="report-body"><div class="report-shell"><aside class="report-sidebar" id="reportSidebar"><div class="report-brand"><div>Backoffice<br><small>Admin Panel</small></div></div><nav class="report-nav"></nav></aside><main class="report-main"><header class="report-topbar"><button class="hamb" data-open-sidebar><i class="bi bi-list"></i></button><div class="user-title-wrap"><div class="user-title-icon"><i class="bi bi-gift"></i></div><div><h1>Bulk Bonus Adjustment</h1><p>Select members visually, review the batch, then credit or debit their bonus wallets.</p></div></div><div class="report-actions" data-bo-profile></div></header>
<section class="report-content"><div class="bulk-operation-layout">
<section class="bulk-panel"><div class="bulk-panel-title"><h2><i class="bi bi-people me-2"></i>Select Members</h2><span class="bulk-count-badge" id="selectedCount">0 selected</span></div>
<div class="member-picker-toolbar"><input id="memberSearch" type="search" placeholder="Search username, member ID, name or mobile"><button class="clean-btn primary" id="memberSearchBtn" type="button"><i class="bi bi-search"></i> Search</button><button class="clean-btn" id="clearSelectionBtn" type="button"><i class="bi bi-x-circle"></i> Clear selected</button></div>
<div class="member-picker-list" id="memberPickerList"></div></section>
<section class="bulk-panel"><div class="bulk-panel-title"><h2><i class="bi bi-list-check me-2"></i>Selected Members</h2></div>
<div class="selected-table-wrap"><table class="selected-table"><thead><tr><th>#</th><th>Member</th><th>Name / Mobile</th><th>Main Balance</th><th></th></tr></thead><tbody id="selectedMembersBody"></tbody></table></div>
<div class="operation-summary"><div class="summary-chip"><span>Members</span><b id="summaryMembers">0</b></div><div class="summary-chip"><span>Amount per member</span><b id="summaryAmount">0.00</b></div><div class="summary-chip"><span>Batch total</span><b id="summaryTotal">0.00</b></div></div>
<div class="operation-form-grid"><div class="field"><label>Type</label><select id="bulkType"><option value="CREDIT">Credit</option><option value="DEBIT">Debit</option></select></div><div class="field"><label>Amount per member</label><input id="bulkAmount" type="number" min="0.01" step="0.01" placeholder="0.00"></div><div class="field"><label>Reason Code</label><input id="bulkReason" value="BONUS_ADJUSTMENT"></div><div class="field"><label>Remark</label><input id="bulkRemark" placeholder="Required audit remark"></div></div>
<div class="operation-actions"><button class="btn-primary-clean" id="bulkSubmit" type="button"><i class="bi bi-check2-circle"></i> Submit Bulk Bonus Adjustment</button></div><div id="bulkStatus"></div></section></div>
<section class="bulk-panel batch-result" id="batchResult" hidden></section></section></main></div>
<script src="assets/js/config.js?v=1.0.28"></script><script src="assets/js/reports.js?v=1.0.13"></script><script src="assets/js/auth.js?v=1.0.29"></script><script>window.BULK_OPERATION_CONFIG={mode:'bonus'};</script><script src="assets/js/bulk-member-operation.js?v=1.0.0"></script><script src="assets/js/bo-ui-standard.js?v=1.0.2"></script></body></html>
