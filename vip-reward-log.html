<!DOCTYPE html>

<html lang="en">
<head>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>VIP Reward Log</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link href="assets/css/reports.css?v=1.0.57" rel="stylesheet"/>
<link href="assets/css/vip-management.css?v=2.0.2" rel="stylesheet"/>
<link href="assets/css/table-pagination-horizontal.css?v=1.0.2" rel="stylesheet"/>
<link href="assets/css/bo-ui-standard.css?v=1.0.6" rel="stylesheet">
<link href="assets/css/bo-targeted-fixes.css?v=1.0.1" rel="stylesheet">
<link href="assets/css/vip-pages-targeted.css?v=1.0.0" rel="stylesheet">
<link href="assets/css/bo-account-chip.css?v=1.0.0" rel="stylesheet" />
<link href="assets/css/bo-charcoal-shell.css?v=1.0.7" rel="stylesheet" />
<link href="assets/css/bo-charcoal-legacy.css?v=1.1.29" rel="stylesheet" />
<link href="assets/css/bo-charcoal-primitives.css?v=1.0.0" rel="stylesheet" />
<link href="assets/css/bo-input-fill.css?v=1.0.1" rel="stylesheet" />
<link href="assets/css/bo-seg-bounce.css?v=1.0.0" rel="stylesheet"/>
<link href="assets/css/vip-reward-log.css?v=2.2.1" rel="stylesheet" />
<script>
(function(){
  try{
    if(localStorage.getItem('bo_theme')==='dark') document.documentElement.setAttribute('data-bo-theme','dark');
  }catch(e){}
})();
</script>
</head>
<body class="report-body vip-log-page vip-reward-log-page bo-charcoal bo-account-chip">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand">
<div>Backoffice<br/><small>Admin Panel</small></div><button class="close-side" data-close-sidebar=""><i class="bi bi-x-lg"></i></button>
</div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar="" id="reportOverlay"></div>
<main class="report-main">
<header class="report-topbar"><button class="hamb" data-open-sidebar=""><i class="bi bi-list"></i></button>
<div class="user-title-wrap">
<div class="user-title-icon"><i class="bi bi-cash-stack"></i></div>
<div>
<h1>VIP Reward Log</h1>
</div>
</div>
<div class="report-actions">
      <button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">
        <i class="bi bi-sun-fill" data-theme-icon="sun"></i>
        <i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i>
      </button>
      <div data-bo-profile></div>
    </div>
</header>
<section class="report-content">
<div class="vip-log-card">
<div class="vip-log-toolbar">
<nav class="bo-tx-tabs bo-seg" id="rewardStatusTabs" aria-label="Reward status" data-bo-seg-anim="bounce">
<button type="button" class="bo-tx-tab is-active" data-reward-status="AVAILABLE" aria-pressed="true">Available</button>
<button type="button" class="bo-tx-tab" data-reward-status="PAID" aria-pressed="false">Paid</button>
<button type="button" class="bo-tx-tab" data-reward-status="SKIPPED" aria-pressed="false">Skipped</button>
<button type="button" class="bo-tx-tab" data-reward-status="" aria-pressed="false">All</button>
</nav>
<div class="vip-log-filters bo-filter-row">
<input id="rewardKeyword" type="search" autocomplete="off" aria-label="Search reward logs" placeholder="Username, mobile, ref"/>
<select id="rewardType" data-bo-auto-width="0" aria-label="Reward type">
<option value="">All Types</option>
<option>DAILY_REBATE</option>
<option>WEEKLY_BONUS</option>
<option>MONTHLY_BONUS</option>
<option>UPGRADE_BONUS</option>
<option>STEP_BONUS</option>
<option>BIRTHDAY_BONUS</option>
</select>
</div>
</div>
<div class="vip-admin-table-wrap">
<div class="vip-tx-table-head">
<table class="vip-admin-table vip-admin-table-head">
<colgroup>
<col class="vip-c-date"/><col class="vip-c-member"/><col class="vip-c-type"/><col class="vip-c-period"/><col class="vip-c-base"/><col class="vip-c-rate"/><col class="vip-c-reward"/><col class="vip-c-maint"/><col class="vip-c-status"/><col class="vip-c-ref"/>
</colgroup>
<thead>
<tr>
<th>Date</th>
<th>Member</th>
<th>Type</th>
<th class="vip-col-period">Period</th>
<th class="vip-col-base">Base</th>
<th class="vip-col-rate">Rate</th>
<th>Reward</th>
<th class="vip-col-maint">Maintenance</th>
<th>Status</th>
<th class="vip-col-reference">Reference / Remark</th>
</tr>
</thead>
</table>
</div>
<div class="vip-tx-table-body" id="rewardTableScroll">
<table class="vip-admin-table vip-admin-table-body">
<colgroup>
<col class="vip-c-date"/><col class="vip-c-member"/><col class="vip-c-type"/><col class="vip-c-period"/><col class="vip-c-base"/><col class="vip-c-rate"/><col class="vip-c-reward"/><col class="vip-c-maint"/><col class="vip-c-status"/><col class="vip-c-ref"/>
</colgroup>
<tbody id="rewardBody">
<tr>
<td class="vip-log-empty" colspan="10">Loading…</td>
</tr>
</tbody>
</table>
</div>
</div>
<div class="table-footer">
<div class="entries-control">Show <select id="rewardPageSize" data-bo-auto-width="0" aria-label="Rows per page">
<option selected value="-">-</option>
<option value="10">10</option>
<option value="20">20</option>
<option value="50">50</option>
<option value="100">100</option>
<option value="All">All</option>
</select> entries</div>
<div class="table-info" id="rewardPageInfo">Showing 0 to 0 of 0 entries</div>
<div class="pagination-clean" id="rewardPagination"></div>
</div>
</div>
</section>
</main>
</div>
<script src="assets/js/config.js?v=1.0.40"></script>
<script src="assets/js/brand-context.js?v=1.0.4"></script>
<script src="assets/js/main-currency-runtime.js?v=1.0.2"></script>
<script src="assets/js/currency-runtime.js?v=1.0.1"></script>
<script src="assets/js/auth.js?v=1.0.66"></script>
<script src="assets/js/reports.js?v=1.0.30"></script>
<script src="assets/js/bo-seg-bounce.js?v=1.0.0"></script>
<script src="assets/js/vip-reward-log.js?v=1.6.1"></script>
<script src="assets/js/pagination-standardizer.js?v=1.0.1"></script>
<script src="assets/js/bo-ui-standard.js?v=1.0.0"></script>
<script src="assets/js/operation-global-notification.js?v=1.0.5"></script>
<!-- Global live-chat unread reminder: sounds across BO until admin unread count reaches 0. -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-config.js?v=1.0.0"></script>
<script src="assets/js/livechat-global-notification.js?v=1.0.11"></script>
<script src="assets/js/bo-theme.js?v=1.0.0"></script>
<script src="assets/js/bo-account-chip.js?v=1.0.0"></script>
</body>
</html>
