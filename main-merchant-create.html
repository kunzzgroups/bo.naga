<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Create Merchant Account</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link href="assets/css/reports.css?v=1.0.47" rel="stylesheet"/>
<link href="assets/css/bo-ui-standard.css?v=1.0.4" rel="stylesheet">
<link href="assets/css/bo-targeted-fixes.css?v=1.0.1" rel="stylesheet"/>
<link href="assets/css/main-admin-detail-executive.css?v=1.0.57" rel="stylesheet"/>
<script>
(function(){
  try{
    if(localStorage.getItem('bo_theme')==='dark') document.documentElement.setAttribute('data-bo-theme','dark');
  }catch(e){}
})();
</script>
</head>
<body class="report-body standardized-listing-page main-admin-detail-page main-admin-create-page main-merchant-create-page" data-access-page="main_merchant_detail">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand"><div>Backoffice<br/><small>Admin Panel</small></div><button class="close-side" data-close-sidebar=""><i class="bi bi-x-lg"></i></button></div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar="" id="reportOverlay"></div>
<main class="report-main">
<header class="report-topbar">
  <button class="hamb" data-open-sidebar=""><i class="bi bi-list"></i></button>
  <div class="user-title-wrap">
    <div class="user-title-icon"><i class="bi bi-person-plus"></i></div>
    <div>
      <h1>Create Merchant</h1>
      <p>Create a merchant using the existing Brand data model and optionally create its master account.</p>
    </div>
  </div>
  <div class="report-actions">
    <button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">
      <i class="bi bi-sun-fill" data-theme-icon="sun"></i>
      <i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i>
    </button>
    <div data-bo-profile=""></div>
  </div>
</header>

<section class="report-content mac-workspace">
  <form id="merchantBrandForm" class="mac-form" novalidate>
    <section class="mac-section">
      <header class="mac-section-head"><span class="mac-section-icon"><i class="bi bi-shop"></i></span><h3>1. Merchant Profile</h3><a class="mad-btn mad-btn-ghost mac-back-section" href="main-merchant-detail.html"><i class="bi bi-arrow-left"></i> Back to List</a></header>
      <div class="mac-fields mac-fields-row">
        <label class="mac-field"><span class="mac-label">Merchant Code <b>*</b></span><input class="form-control" id="merchantCode" required placeholder="e.g. T2"/><small>Existing Brand code becomes the Merchant code.</small></label>
        <label class="mac-field"><span class="mac-label">Merchant Name <b>*</b></span><input class="form-control" id="merchantName" required placeholder="e.g. Titan X2"/></label>
        <label class="mac-field"><span class="mac-label">Primary Domain <b>*</b></span><input class="form-control" id="merchantDomain" required placeholder="e.g. t2.example.com"/></label>
        <label class="mac-field"><span class="mac-label">Status</span><select class="form-control" id="merchantStatus"><option value="1">Active</option><option value="0">Suspended</option></select></label>
        <label class="mac-field"><span class="mac-label">Domain Aliases</span><input class="form-control" id="merchantAliases" placeholder="alias1.com, alias2.com"/></label>
        <label class="mac-field"><span class="mac-label">Frontend Root</span><input class="form-control" id="merchantRoot" placeholder="/var/www/site"/></label>
        <label class="mac-field"><span class="mac-label">Currency</span><input class="form-control" id="merchantCurrency" value="MYR" maxlength="20"/></label>
      </div>
    </section>
    <section class="mac-section">
      <header class="mac-section-head"><span class="mac-section-icon"><i class="bi bi-wallet2"></i></span><h3>2. Credit Configuration</h3></header>
      <div class="mac-fields mac-fields-row">
        <label class="mac-field"><span class="mac-label">Credit Mode</span><select class="form-control" id="merchantCreditMode"><option value="WHOLE">Whole Provider Pool</option><option value="PER_PROVIDER">Per Provider</option></select></label>
        <label class="mac-field"><span class="mac-label">Low Credit Threshold</span><input class="form-control" id="merchantThreshold" type="number" min="0" step="0.0001" value="0"/></label>
        <label class="mac-field"><span class="mac-label">Provider Markup (%)</span><input class="form-control" id="merchantMarkup" type="number" min="0" max="100" step="0.0001" value="0"/></label>
      </div>
    </section>
    <section class="mac-section">
      <header class="mac-section-head"><span class="mac-section-icon"><i class="bi bi-person-badge"></i></span><h3>3. Merchant Master Account</h3></header>
      <div class="mac-fields mac-fields-row">
        <label class="mac-field"><span class="mac-label">Display Name</span><input class="form-control" id="merchantMasterName" placeholder="Merchant Master"/></label>
        <label class="mac-field"><span class="mac-label">Username</span><input class="form-control" id="merchantMasterUsername" autocomplete="username" placeholder="merchant.master"/><small>Optional. Leave blank if you will create the merchant master later.</small></label>
        <label class="mac-field"><span class="mac-label">Password</span><input class="form-control" id="merchantMasterPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Minimum 8 characters"/></label>
      </div>
    </section>
    <div class="upload-status mb-3" id="merchantCreateStatus"></div>
    <footer class="mac-footer-actions"><a class="mad-btn mad-btn-ghost" href="main-merchant-detail.html">Cancel</a><button class="mad-btn mad-btn-navy" type="submit"><i class="bi bi-check2"></i> Create Merchant</button></footer>
  </form>
</section>

</main>
</div>
<script src="assets/js/config.js?v=1.0.40"></script>
<script src="assets/js/brand-context.js?v=1.0.4"></script>
<script src="assets/js/reports.js?v=1.0.25"></script>
<script src="assets/js/auth.js?v=1.0.58"></script>
<script src="assets/js/main-merchant-visibility.js?v=1.0.0"></script>
<script src="assets/js/main-merchant-create.js?v=1.0.2"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-config.js?v=1.0.0"></script>
<script src="assets/js/livechat-global-notification.js?v=1.0.11"></script>
<script src="assets/js/operation-global-notification.js?v=1.0.5"></script>
<script src="assets/js/bo-ui-standard.js?v=1.0.4"></script>
<script src="assets/js/bo-theme.js?v=1.0.0"></script>
</body>
</html>
