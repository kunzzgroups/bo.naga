<!DOCTYPE html>

<html lang="en">
<head>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Withdraw Approval</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link href="assets/css/reports.css?v=1.0.44" rel="stylesheet"/>
<link href="assets/css/table-pagination-horizontal.css?v=1.0.2" rel="stylesheet"/>
<link href="assets/css/operations-upgrade.css?v=1.0.2" rel="stylesheet"/>
<link href="assets/css/bo-ui-standard.css?v=1.0.3" rel="stylesheet">
<link href="assets/css/bo-targeted-fixes.css?v=1.0.1" rel="stylesheet">
</link></link></head>
<body class="report-body standardized-listing-page withdraw-approval-page">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand">
<div>Backoffice<br/><small>Admin Panel</small></div><button class="close-side" data-close-sidebar=""><i class="bi bi-x-lg"></i></button>
</div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar="" id="reportOverlay"></div>
<main class="report-main">
<header class="report-topbar">
<button class="hamb" data-open-sidebar=""><i class="bi bi-list"></i></button>
<div class="user-title-wrap">
<div class="user-title-icon"><i class="bi bi-cash-stack"></i></div>
<div>
<h1>Withdraw Approval</h1>
<p>Review and process member withdrawal requests.</p>
</div>
</div>
<div class="report-actions" data-bo-profile=""></div>
</header>
<section class="report-content">
<div class="quick-stats approval-pending-stats">
<div class="metric"><span>Pending Count</span><strong id="wdPendingCount">0</strong></div>
<div class="metric"><span>Pending Amount</span><strong id="wdPendingAmount">0.00</strong></div>
</div>
<div class="filter-card">
<div class="user-search-grid bo-filter-row">
<div class="field"><label>Date From</label><input id="withdrawFrom" type="date"/></div>
<div class="field"><label>Date To</label><input id="withdrawTo" type="date"/></div>
<div class="field"><label>Search</label><input id="withdrawKeyword" placeholder="Username / mobile / bank / reference"/></div>
<div class="field"><label>Status</label><select id="withdrawStatus"><option value="PENDING">Pending</option><option value="APPROVED">Approved</option><option value="REJECTED">Rejected</option><option value="">All</option></select></div>
<div class="field"><label>Page Size</label><select id="withdrawSize"><option>20</option><option>50</option><option>100</option></select></div>
<div class="field withdraw-reset-field"><label> </label><button class="clean-btn w-100" id="withdrawResetBtn" type="button"><i class="bi bi-arrow-clockwise"></i> Reset</button></div>
<div class="field withdraw-search-field"><label> </label><button class="btn-primary-clean w-100" id="withdrawSearchBtn" type="button"><i class="bi bi-search"></i> Search</button></div>
</div>
</div>
<div class="table-card">
<div class="user-toolbar mb-3"><div class="user-badge"><i class="bi bi-cash-coin"></i><span>Withdraw Requests</span></div><small class="text-muted" id="withdrawPageInfo"></small></div>
<div class="table-wrap">
<table class="report-table">
<thead><tr>
<th>Date</th><th>Member</th><th>Amount</th><th>Bank</th><th>Reference</th><th>Remark</th><th>Status</th><th>Processed</th><th>Action</th>
</tr></thead>
<tbody id="withdrawBody"><tr><td colspan="9">Loading...</td></tr></tbody>
</table>
</div>
<div class="approval-total-bar"><span>Filtered Total Amount</span><strong id="withdrawTotalAmount">0.00</strong></div>
<div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
<button class="clean-btn" id="withdrawPrevBtn" type="button">Previous</button>
<span class="text-muted small" id="withdrawPager"></span>
<button class="clean-btn" id="withdrawNextBtn" type="button">Next</button>
</div>
</div>
</section>
</main>
</div>
<script src="assets/js/config.js?v=1.0.37"></script>
<script src="assets/js/brand-context.js?v=1.0.4"></script>
<script src="assets/js/auth.js?v=1.0.54"></script>
<script src="assets/js/reports.js?v=1.0.17"></script>
<script src="assets/js/bo-date-range.js?v=1.0.15"></script>
<script src="assets/js/member-withdraw.js?v=1.0.8"></script>
<!-- Global live-chat listener: keeps the custom MP3 notification active throughout the BO. -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-config.js?v=1.0.0"></script>
<script src="assets/js/livechat-global-notification.js?v=1.0.11"></script>
<script src="assets/js/pagination-standardizer.js?v=1.0.1"></script>
<script src="assets/js/operation-global-notification.js?v=1.0.5"></script>
<script src="assets/js/bo-ui-standard.js?v=1.0.0"></script>
</body>
</html>
