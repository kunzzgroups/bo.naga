.dashboard-workspace{padding:0!important;width:100%!important;max-width:100%!important;min-width:0!important;min-height:calc(100vh - 142px);background:transparent;overflow-x:hidden!important}
.dashboard-workspace-frame{display:block;width:100%!important;max-width:100%!important;min-width:0!important;height:calc(100vh - 142px);min-height:650px;border:0;background:transparent;overflow:hidden}

<body class="report-body bo-charcoal bo-account-chip">
<div class="report-shell">
  <aside class="report-sidebar" id="reportSidebar">
    <div class="report-brand"><div>Backoffice<br><small>Admin Panel</small></div><button class="close-side" data-close-sidebar><i class="bi bi-x-lg"></i></button></div>
    <nav class="report-nav"></nav>
  </aside>
  <div class="sidebar-overlay" data-close-sidebar></div>
  <main class="report-main">
    <header class="report-topbar"><button class="hamb" data-open-sidebar><i class="bi bi-list"></i></button>
      <div class="user-title-wrap"><div class="user-title-icon"><i class="bi bi-speedometer2"></i></div><div><h1>Dashboard</h1></div></div>
      <div class="report-actions"><button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode"><i class="bi bi-sun-fill" data-theme-icon="sun"></i><i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i></button><div data-bo-profile></div></div>
    </header>
    <section class="report-content dashboard-workspace">
      <iframe id="dashboardWorkspaceFrame" class="dashboard-workspace-frame" title="Dashboard selected page" hidden></iframe>
    </section>
  </main>
</div>
