<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Highest Turnover Games</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="assets/css/reports.css?v=1.0.32" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="assets/css/table-pagination-horizontal.css?v=2.0.2"
    />
  </head>
  <body class="report-body standardized-listing-page">
    <div class="report-shell">
      <aside class="report-sidebar" id="reportSidebar">
        <div class="report-brand">
          <div>Backoffice<br /><small>Admin Panel</small></div>
          <button class="close-side" data-close-sidebar>
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
        <nav class="report-nav"></nav>
      </aside>
      <div class="sidebar-overlay" id="reportOverlay" data-close-sidebar></div>
      <main class="report-main">
        <header class="report-topbar">
          <button class="hamb" data-open-sidebar>
            <i class="bi bi-list"></i>
          </button>
          <div class="user-title-wrap">
            <div class="user-title-icon">
              <i class="bi bi-graph-up-arrow"></i>
            </div>
            <div>
              <h1>Highest Turnover Games</h1>
              <p>
                See every member’s highest-turnover game without opening members
                one by one.
              </p>
            </div>
          </div>
          <div class="report-actions" data-bo-profile></div>
        </header>
        <section class="report-content">
          <div class="filter-card">
            <div class="user-search-grid">
              <div class="field">
                <label>Member</label
                ><input
                  id="gameRankSearch"
                  placeholder="Member ID, username, name or mobile"
                />
              </div>
              <div class="field">
                <label>Provider Code</label
                ><input id="gameRankProvider" placeholder="Example: LIVE22" />
              </div>
              <div class="field">
                <label>Rows Per Page</label
                ><select id="gameRankSize">
                  <option>10</option>
                  <option selected>20</option>
                  <option>50</option>
                  <option>100</option>
                </select>
              </div>
              <div class="field user-filter-actions">
                <label>&nbsp;</label>
                <div class="filter-action-row">
                  <button class="clean-btn" id="gameRankReset">
                    <i class="bi bi-arrow-clockwise"></i> Reset</button
                  ><button class="btn-primary-clean" id="gameRankSearchBtn">
                    <i class="bi bi-search"></i> Search
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="table-card">
            <div class="user-toolbar mb-3">
              <div class="user-title-row">
                <div class="user-badge">
                  <i class="bi bi-graph-up-arrow"></i
                  ><span>Members by Highest Turnover Game</span>
                </div>
                <span class="users-found-badge" id="gameRankCount"
                  >0 Members</span
                >
              </div>
              <button class="clean-btn" id="gameRankRefresh">
                <i class="bi bi-arrow-clockwise"></i> Refresh
              </button>
            </div>
            <div class="table-wrap">
              <table class="report-table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Member ID</th>
                    <th>Username</th>
                    <th>Name</th>
                    <th>Mobile</th>
                    <th>Provider</th>
                    <th>Game</th>
                    <th>Total Turnover</th>
                    <th>Play Count</th>
                    <th>Last Played</th>
                  </tr>
                </thead>
                <tbody id="gameRankBody">
                  <tr>
                    <td colspan="11">Loading...</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div
              class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2"
            >
              <button class="clean-btn" id="gameRankPrev">Previous</button
              ><span id="gameRankPager" class="text-muted small"></span
              ><button class="clean-btn" id="gameRankNext">Next</button>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="assets/js/config.js?v=1.0.25"></script>
    <script src="assets/js/auth.js?v=1.0.25"></script>
    <script src="assets/js/reports.js?v=1.0.11"></script>
    <script>
      window.GAME_RANKING_MODE = "turnover";
    </script>
    <script src="assets/js/player-game-ranking.js?v=1.0.0"></script>
    <script src="assets/js/operation-global-notification.js?v=20260729-2"></script>
  </body>
</html>
