<body class="report-body standardized-listing-page brand-agent-standard bo-charcoal bo-account-chip" data-access-page="agent_performance_report"><div class="report-shell"><aside class="report-sidebar" id="reportSidebar"><div class="report-brand"><div>Backoffice<br><small>Admin Panel</small></div><button class="close-side" data-close-sidebar><i class="bi bi-x-lg"></i></button></div><nav class="report-nav"></nav></aside><div class="sidebar-overlay" data-close-sidebar></div><main class="report-main"><header class="report-topbar"><button class="hamb" data-open-sidebar><i class="bi bi-list"></i></button><div class="user-title-wrap"><div class="user-title-icon"><i class="bi bi-graph-up-arrow"></i></div><div><h1>Agent Performance Report</h1></div></div><div class="report-actions">

      </button>
      <div data-bo-profile></div>
