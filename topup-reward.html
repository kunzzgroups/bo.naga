<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Top-up Reward</title><link rel="stylesheet" href="assets/css/bootstrap.min.css"><link rel="stylesheet" href="assets/css/bootstrap-icons.css"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/topup-reward.css?v=1.0.0"></head><body class="report-body bo-charcoal bo-account-chip"><main class="container-fluid py-4"><div class="d-flex justify-content-between align-items-center mb-3"><div><h2>Top-up Reward</h2><p class="text-muted mb-0">Configure the selected brand's deposit competition and prizes.</p></div><button class="btn btn-primary" id="trSave"><i class="bi bi-check2"></i> Save</button></div><div class="card p-3 mb-3"><div class="row g-3"><div class="col-md-6"><label>Campaign Title</label><input class="form-control" id="trTitle"></div><div class="col-md-6"><label>Subtitle</label><input class="form-control" id="trSubtitle"></div><div class="col-md-3"><label>Start</label><input type="datetime-local" class="form-control" id="trStart"></div><div class="col-md-3"><label>End</label><input type="datetime-local" class="form-control" id="trEnd"></div><div class="col-md-2"><label>Display Top</label><input type="number" min="1" max="100" class="form-control" id="trLimit" value="10"></div><div class="col-md-2"><label>Home Preview</label><input type="number" min="1" max="10" class="form-control" id="trPreview" value="3"></div><div class="col-md-2"><label>Min. Qualify</label><input type="number" min="0" step="0.01" class="form-control" id="trMin" value="0"></div><div class="col-md-8"><label>Banner Image URL</label><div class="input-group"><input class="form-control" id="trBanner"><input type="file" id="trBannerFile" accept="image/*" hidden><button class="btn btn-outline-secondary" id="trBannerUpload" type="button">Upload</button></div></div><div class="col-md-4 d-flex align-items-end gap-3"><label><input type="checkbox" id="trEnabled" checked> Campaign Enabled</label><label><input type="checkbox" id="trCountdown" checked> Countdown</label><label><input type="checkbox" id="trAmount" checked> Amount</label><label><input type="checkbox" id="trMyRank" checked> My Rank</label></div><div class="col-12"><label>Terms / Wording</label><textarea class="form-control" rows="3" id="trTerms"></textarea></div></div></div><div class="card p-3"><div class="d-flex justify-content-between mb-2"><div><h4 class="mb-0">Prizes</h4><small class="text-muted">Use rank ranges such as 6–10 when prizes are the same.</small></div><button class="btn btn-outline-primary" id="trAddPrize">+ Add Prize</button></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>From</th><th>To</th><th>Prize</th><th>Description</th><th>Image</th><th></th></tr></thead><tbody id="trPrizeBody"></tbody></table></div></div></main><script src="assets/js/config.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/topup-reward.js?v=1.0.0"></script></body></html>
