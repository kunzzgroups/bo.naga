<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Promotion / Bonus Report</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/reports.css?v=1.0.33" rel="stylesheet">
  <link href="assets/css/operations-upgrade.css?v=1.0.1" rel="stylesheet">
  <link href="assets/css/bo-ui-standard.css?v=1.0.1" rel="stylesheet" />
  <link href="assets/css/bo-targeted-fixes.css?v=1.0.1" rel="stylesheet" />
  <link href="assets/css/promotion-report-targeted.css?v=1.0.2" rel="stylesheet" />
</head>

<body class="report-body promotion-report-page">
  <div class="report-shell">
    <aside class="report-sidebar">
      <div class="report-brand">
        <div>Backoffice<br><small>Admin Panel</small></div>
      </div>
      <nav class="report-nav"></nav>
    </aside>
    <main class="report-main">
      <header class="report-topbar"><button class="hamb" data-open-sidebar><i class="bi bi-list"></i></button>
        <div class="user-title-wrap">
          <div class="user-title-icon"><i class="bi bi-table"></i></div>
          <div>
            <h1>Promotion / Bonus Report</h1>
            <p>Detailed casino operational records.</p>
          </div>
        </div>
        <div class="report-actions" data-bo-profile></div>
      </header>
      <section class="report-content">
        <div class="ops-filter bo-filter-row">
          <div class="field promotion-from-field"><label>From</label><input id="reportFrom" type="date"></div>
          <div class="field promotion-to-field"><label>To</label><input id="reportTo" type="date"></div>
          <div id="typeBox"><label>Type</label><select id="reportType">
              <option value="">All</option>
              <option>DEPOSIT</option>
              <option>WITHDRAW</option>
              <option>BONUS</option>
              <option>ADJUSTMENT</option>
              <option>REBATE</option>
            </select></div><button class="btn-primary-clean" id="reportSearch">Search</button>
        </div>
        <br>
        <div class="table-card">
          <div class="table-wrap">
            <table class="report-table">
              <thead id="reportHead"></thead>
              <tbody id="reportBody"></tbody>
            </table>
          </div>
          <div class="table-footer standard-pagination ops-table-footer">
            <div class="entries-control"
              style="display:inline-flex!important;align-items:center!important;gap:8px!important;width:auto!important;min-width:0!important;max-width:max-content!important;flex:0 0 auto!important;white-space:nowrap!important">
              Show <select id="reportPageSize"
                style="display:inline-block!important;width:68px!important;min-width:68px!important;max-width:68px!important;flex:0 0 68px!important;height:40px!important;padding:0 28px 0 12px!important;margin:0!important">
                <option>10</option>
                <option>25</option>
                <option>50</option>
                <option>100</option>
              </select> entries</div>
            <div class="table-info" id="reportShowing">Showing 0 to 0 of 0 entries</div>
            <div class="pagination-clean" id="reportPager"></div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script>window.OP_REPORT_ENDPOINT = '/api/admin/operations/promotion-report'; window.OP_REPORT_KIND = 'promotion-report';</script>
  <script src="assets/js/config.js?v=1.0.30"></script>
  <script src="assets/js/bo-date-range.js?v=1.0.9"></script>
  <script src="assets/js/operations-report.js?v=1.0.2"></script>
  <script src="assets/js/reports.js?v=1.0.13"></script>
  <script src="assets/js/auth.js?v=1.0.31"></script>
  <script src="assets/js/bo-ui-standard.js?v=1.0.0"></script>
<script src="assets/js/operation-global-notification.js?v=1.0.5"></script>

<!-- Global live-chat unread reminder: sounds across BO until admin unread count reaches 0. -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-config.js?v=1.0.0"></script>
<script src="assets/js/livechat-global-notification.js?v=20260811-global-v3"></script>
</body>

</html>
