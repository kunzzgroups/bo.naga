<body class="report-body transaction-report-page">
<div class="report-shell">
<aside class="report-sidebar">
<div class="report-brand">
<div>Backoffice<br/><small>Admin Panel</small></div>
</div>
<nav class="report-nav"></nav>
</aside>
<main class="report-main">
<header class="report-topbar"><button class="hamb" data-open-sidebar=""><i class="bi bi-list"></i></button>
<div class="user-title-wrap">
<div class="user-title-icon"><i class="bi bi-table"></i></div>
<div>
<h1>Transaction Report</h1>
<p>Wallet-to-wallet transfer records only.</p>
</div>
</div>
<div class="report-actions" data-bo-profile=""></div>
</header>
<section class="report-content">
<div class="ops-filter bo-filter-row">
<div class="field transaction-from-field"><label>From</label><input id="reportFrom" type="date"/></div>
<div class="field transaction-to-field"><label>To</label><input id="reportTo" type="date"/></div>
<div aria-hidden="true" class="bo-filter-hidden-item" id="typeBox"><label>Type</label><select id="reportType">
<option selected="" value="WALLET_TO_WALLET">Wallet to Wallet</option>
</select></div><button class="btn-primary-clean" id="reportSearch">Search</button>
</div>
<br/>
<div class="table-card">
<div class="table-wrap">
<table class="report-table">
<thead id="reportHead"></thead>
<tbody id="reportBody"></tbody>
</table>
</div>
<div class="table-footer">
<div class="entries-control">
                Show
                <select id="reportPageSize">
<option>10</option>
<option>25</option>
<option>50</option>
<option>100</option>
</select>
                entries
              </div>
<div class="table-info" id="reportShowing">Showing 0 to 0 of 0 entries</div>
<div class="pagination-clean" id="reportPager"></div>
</div>
</div>
</section>
</main>
