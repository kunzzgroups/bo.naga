<link href="assets/css/table-pagination-horizontal.css?v=1.0.2" rel="stylesheet"/>

<link href="assets/css/bo-targeted-fixes.css?v=1.0.1" rel="stylesheet"/>

<script>
(function(){
  try{
    if(localStorage.getItem('bo_theme')==='dark') document.documentElement.setAttribute('data-bo-theme','dark');
  }catch(e){}
})();
</script>
</head>
<body class="report-body standardized-listing-page menu-permission-page main-merchant-roles-page" data-access-page="main_merchant_detail">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand"><div>Backoffice<br/><small>Admin Panel</small></div><button class="close-side" data-close-sidebar=""><i class="bi bi-x-lg"></i></button></div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar="" id="reportOverlay"></div>
<main class="report-main">
<header class="report-topbar"><button class="hamb" data-open-sidebar=""><i class="bi bi-list"></i></button>
<div class="user-title-wrap">
  <div class="user-title-icon"><i class="bi bi-file-earmark-text"></i></div>
  <div>
    <h1>Roles &amp; Permissions</h1>
    <p>Assign sidebar menu access and operational routes to merchant roles.</p>
  </div>
</div>
<div class="report-actions">
<button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">
  <i class="bi bi-sun-fill" data-theme-icon="sun"></i>
  <i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i>
</button>
<div data-bo-profile=""></div>
</div>
</header>

<section class="report-content mp-workspace">
  <div class="mad-chrome mp-chrome">
    <div class="mad-tabs" role="tablist" aria-label="Merchant sections">
      <a class="mad-tab" role="tab" aria-selected="false" href="main-merchant-detail.html">Merchants</a>
      <a class="mad-tab is-active" role="tab" aria-selected="true" href="main-merchant-roles.html">Roles &amp; Permissions</a>
      <a class="mad-tab" role="tab" aria-selected="false" href="main-merchant-credit.html">Credit Control</a>
      <a class="mad-tab" role="tab" aria-selected="false" href="main-merchant-security.html">Security &amp; Audit</a>
    </div>
    <div class="mad-chrome-actions">
      <a class="mad-btn mad-btn-primary mp-add-role-btn" href="main-merchant-role-create.html">
        <i class="bi bi-plus-lg" aria-hidden="true"></i> Add Role
      </a>
    </div>
  </div>

  <form id="menuPermissionForm" class="mp-form">
    <input id="menuPermissionRoleId" type="hidden"/>

    <div class="mp-control-card">
      <div class="mp-role-row">
        <label class="mp-role-label" for="menuPermissionRoleSelect">Role / Permission Group:</label>
        <select class="form-select mp-role-select" id="menuPermissionRoleSelect">
          <option value="">Select role...</option>
        </select>
        <span class="mp-assigned-pill" id="menuPermissionAssignedPill" hidden>
          <i class="bi bi-circle-fill" aria-hidden="true"></i>
          <span id="menuPermissionAssignedText">Assigned: 0 / 0 Menus</span>
        </span>
      </div>

      <div class="mp-toolbar">
        <label class="mp-search" for="menuPermissionFilter">
          <i class="bi bi-search" aria-hidden="true"></i>
          <input id="menuPermissionFilter" type="search" placeholder="Filter menus or URLs..." autocomplete="off" disabled>
        </label>
        <div class="mp-toolbar-actions">
          <button class="mp-tool-btn is-accent" id="menuPermissionToggleAll" type="button" disabled><i class="bi bi-magic"></i> Toggle All</button>
          <button class="mp-tool-btn" id="menuPermissionSelectAll" type="button" disabled><i class="bi bi-check2-circle"></i> Select All</button>
          <button class="mp-tool-btn" id="menuPermissionClearAll" type="button" disabled><i class="bi bi-x-lg"></i> Clear</button>
        </div>
      </div>
    </div>

    <div class="mp-matrix" id="menuPermissionCheckList">
      <div class="permission-empty">Select a role to view menu permissions.</div>
    </div>

    <div class="upload-status mp-inline-status" id="menuPermissionStatus"></div>

    <div class="mp-footer" id="menuPermissionFooter" hidden>
      <div class="mp-footer-meta">
        <i class="bi bi-circle-fill mp-footer-dot" aria-hidden="true"></i>
        <span class="mp-footer-role">Editing Role: <b id="menuPermissionFooterRole">�??/b></span>
        <span class="mp-footer-sep" aria-hidden="true">|</span>
        <em id="menuPermissionFooterDirty">No changes</em>
      </div>
      <div class="mp-footer-actions">
        <button class="mp-btn-ghost" id="menuPermissionResetBtn" type="button" disabled>Reset Changes</button>
        <button class="mp-btn-save" id="saveMenuPermissionBtn" type="submit" disabled>
          <i class="bi bi-check2"></i> Save Permissions
        </button>
      </div>
    </div>
  </form>
</section>
</main>
</div>

</body>
</html>
