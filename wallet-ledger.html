<!DOCTYPE html>

<html lang="en">
<head>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Wallet Ledger</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link href="assets/css/reports.css?v=1.0.50" rel="stylesheet"/>
<link href="assets/css/table-pagination-horizontal.css?v=1.0.3" rel="stylesheet"/>
<link href="assets/css/operations-upgrade.css?v=1.0.2" rel="stylesheet"/>
<link href="assets/css/bo-ui-standard.css?v=1.0.5" rel="stylesheet"/>
<link href="assets/css/bo-targeted-fixes.css?v=1.0.1" rel="stylesheet"/>
<link href="assets/css/bo-wallet-transaction-amber.css?v=1.0.93" rel="stylesheet"/>
<link href="assets/css/bo-input-fill.css?v=1.0.1" rel="stylesheet"/>
<script>
(function(){
  try{
    if(localStorage.getItem('bo_theme')==='dark') document.documentElement.setAttribute('data-bo-theme','dark');
  }catch(e){}
})();
</script>
</head>
<body class="report-body standardized-listing-page wallet-ledger-page bo-wallet-tx">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand">
<div>Backoffice<br/><small>Admin Panel</small></div><button class="close-side" data-close-sidebar=""><i class="bi bi-x-lg"></i></button>
</div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar="" id="reportOverlay"></div>
<main class="report-main">
<header class="report-topbar">
<button class="hamb" data-open-sidebar=""><i class="bi bi-list"></i></button>
<div class="user-title-wrap">
<div class="user-title-icon"><i class="bi bi-journal-check"></i></div>
<div>
<h1>Wallet Ledger</h1>
</div>
</div>
<div class="report-actions">
<button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">
<i class="bi bi-sun-fill" data-theme-icon="sun"></i>
<i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i>
</button>
<div data-bo-profile></div>
</div>
</header>
<section class="report-content">
<div class="quick-stats">
<div class="metric"><span>Deposit</span><strong id="wlDeposit">0.00</strong></div>
<div class="metric"><span>Withdraw</span><strong id="wlWithdraw">0.00</strong></div>
<div class="metric"><span>Transfer</span><strong id="wlTransfer">0.00</strong></div>
<div class="metric"><span>Bet Win/Lose</span><strong id="wlBetWinLose">0.00</strong></div>
</div>
<div class="table-card ledger-list-card">
<div class="filter-card ledger-inline-filter">
<div class="user-search-grid bo-filter-row bo-tx-filter-controls">
<div class="field"><label>From</label><input id="ledgerFrom" type="date"/></div>
<div class="field"><label>To</label><input id="ledgerTo" type="date"/></div>
<div class="field"><label>Member ID</label><input id="ledgerMemberId" placeholder="Member ID"/></div>
<div class="field"><label>Provider</label><input id="ledgerProviderCode" placeholder="Provider"/></div>
<div class="field ledger-type-field"><label>Type</label>
<div class="ledger-type-multi" id="ledgerTypeMulti">
<input id="ledgerType" type="hidden" value=""/>
<button aria-expanded="false" aria-haspopup="listbox" class="ledger-type-trigger" id="ledgerTypeTrigger" type="button">
<span id="ledgerTypeLabel">All types</span><i class="bi bi-chevron-down" aria-hidden="true"></i>
</button>
<div class="ledger-type-menu" hidden="" id="ledgerTypeMenu" role="listbox">
<label class="ledger-type-option ledger-type-all"><input checked="" id="ledgerTypeAll" type="checkbox"/><span>All</span></label>
<div class="ledger-type-divider"></div>
<div id="ledgerTypeOptions"></div>
</div>
</div>
</div>
<div class="field user-filter-actions wallet-filter-actions"><label>&nbsp;</label><div class="filter-action-row"><button class="clean-btn" id="ledgerResetBtn" type="button"><i class="bi bi-arrow-clockwise"></i> Reset</button><button class="btn-primary-clean" id="ledgerSearchBtn" type="button"><i class="bi bi-search"></i> Search</button></div></div>
</div>
<select id="ledgerSize" hidden data-no-rounded="1" aria-hidden="true" tabindex="-1"><option value="20" selected>20</option><option value="50">50</option><option value="100">100</option></select>
</div>
<div class="table-wrap">
<table class="report-table ledger-main-table">
<thead><tr>
<th>Created Time</th><th>Posted Time</th><th>Member</th><th>Provider</th><th>Type</th><th>Amount</th><th>Before</th><th>After</th><th>Game</th><th>Created By</th><th>Approved By</th><th>Reason Code</th><th>Related ID</th><th>Remark</th><th>Status</th>
</tr></thead>
<tbody id="walletLedgerBody"><tr><td colspan="15">Loading...</td></tr></tbody>
</table>
</div>
<div class="bo-ledger-footer">
<small class="bo-ledger-scope-info" id="ledgerPageInfo"></small>
<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 bo-ledger-pager-host">
<button class="clean-btn" id="ledgerPrevBtn" type="button">Previous</button>
<div id="ledgerPager" class="pagination-clean-inner" aria-label="Page numbers"></div>
<button class="clean-btn" id="ledgerNextBtn" type="button">Next</button>
</div>
</div>
</div>
</section>
</main>
</div>
<script src="assets/js/config.js?v=1.0.40"></script>
<script src="assets/js/brand-context.js?v=1.0.4"></script>
<script src="assets/js/main-currency-runtime.js?v=1.0.2"></script>
<script src="assets/js/currency-runtime.js?v=1.0.1"></script>
<script src="assets/js/auth.js?v=1.0.65"></script>
<script src="assets/js/bo-theme.js?v=1.0.0"></script>
<script src="assets/js/reports.js?v=1.0.29"></script>
<script src="assets/js/bo-date-range.js?v=1.0.17"></script>
<script src="assets/js/wallet-ledger.js?v=1.0.12"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-config.js?v=1.0.0"></script>
<script src="assets/js/livechat-global-notification.js?v=1.0.11"></script>
<script src="assets/js/pagination-standardizer.js?v=1.0.7"></script>
<script src="assets/js/operation-global-notification.js?v=1.0.5"></script>
<script src="assets/js/bo-ui-standard.js?v=1.0.0"></script>
</body>
</html>
