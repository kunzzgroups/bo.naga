<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Admin Operation Log</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link href="assets/css/reports.css?v=1.0.39" rel="stylesheet"/>
<link href="assets/css/rebate-pages.css?v=1.0.3" rel="stylesheet"/>
<link href="assets/css/table-pagination-horizontal.css?v=1.0.2" rel="stylesheet"/>
<link href="assets/css/bo-ui-standard.css?v=1.0.1" rel="stylesheet"/>
</head>
<body class="report-body rebate-page">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand">
<div>Backoffice<br/><small>Admin Panel</small></div>
<button class="close-side" data-close-sidebar="">
<i class="bi bi-x-lg"></i>
</button>
</div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar="" id="reportOverlay"></div>
<main class="report-main">
<header class="report-topbar">
<button class="hamb" data-open-sidebar="">
<i class="bi bi-list"></i>
</button>
<div class="user-title-wrap">
<div class="user-title-icon">
<i class="bi bi-journal-text"></i>
</div>
<div>
<h1>Admin Operation Log</h1>
<p>Business actions performed by BO administrators.</p>
</div>
</div>
<div class="report-actions" data-bo-profile=""></div>
</header>
<section class="report-content">
<div class="standard-list-card">
<div class="standard-card-head">
<div>
<h2>Operation History</h2>
<p>
                  Create, update, delete, approve, reject and adjustment
                  actions.
                </p>
</div>
<button class="clean-btn" id="refreshBtn">
<i class="bi bi-arrow-clockwise"></i> Refresh
              </button>
</div>
<div class="standard-filter-grid bo-filter-row">
<label><span>Admin</span><input id="actor" placeholder="Username"/></label><label><span>Action</span><select id="action">
<option value="">All Actions</option>
<option>CREATE_GAME</option>
<option>UPDATE_GAME</option>
<option>DELETE_GAME</option>
<option>APPROVE_DEPOSIT</option>
<option>REJECT_DEPOSIT</option>
<option>APPROVE_WITHDRAWAL</option>
<option>REJECT_WITHDRAWAL</option>
<option>ADJUST_MEMBER_WALLET</option>
</select></label><button class="clean-btn" id="resetBtn">
<i class="bi bi-arrow-counterclockwise"></i> Reset</button><button class="clean-btn primary" id="searchBtn">
<i class="bi bi-search"></i> Search
              </button>
</div>
<div class="standard-table-wrap">
<table class="standard-data-table">
<thead>
<tr>
<th>Date / Time</th>
<th>Admin</th>
<th>Action</th>
<th>Module</th>
<th>IP Address</th>
<th>Details</th>
<th>Result</th>
</tr>
</thead>
<tbody id="rows">
<tr>
<td class="table-empty" colspan="7">Loading...</td>
</tr>
</tbody>
</table>
</div>
<div class="table-footer">
<div class="entries-control">
                Show
                <select id="pageSize">
<option>10</option>
<option selected="">20</option>
<option>50</option>
<option>100</option>
</select>
                entries
              </div>
<div class="table-info" id="showing">
                Showing 0 to 0 of 0 entries
              </div>
<div class="pagination-clean" id="pager"></div>
</div>
</div>
</section>
</main>
</div>
<script src="assets/js/config.js?v=1.0.33"></script>
<script src="assets/js/auth.js?v=1.0.34"></script>
<script src="assets/js/reports.js?v=1.0.14"></script>
<script src="assets/js/admin-operation-log.js?v=1.0.1"></script>
<script src="assets/js/pagination-standardizer.js?v=1.0.1"></script>
<script src="assets/js/operation-global-notification.js?v=1.0.5"></script>
<script src="assets/js/bo-ui-standard.js?v=1.0.0"></script>
<!-- Global live-chat unread reminder: sounds across BO until admin unread count reaches 0. -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-config.js?v=1.0.0"></script>
<script src="assets/js/livechat-global-notification.js?v=20260811-global-v3"></script>
</body>
</html>
