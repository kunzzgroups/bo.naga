<head>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Member Wallet Listing</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>

<script>
(function(){
  try{
    if(localStorage.getItem('bo_theme')==='dark') document.documentElement.setAttribute('data-bo-theme','dark');
  }catch(e){}
})();
</script>
</head>
<body class="report-body standardized-listing-page member-wallet-page bo-wallet-tx">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand">
<div>Backoffice<br/><small>Admin Panel</small></div><button class="close-side" data-close-sidebar=""><i class="bi bi-x-lg"></i></button>
</div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar="" id="reportOverlay"></div>
<main class="report-main">
<header class="report-topbar">
<button class="hamb" data-open-sidebar=""><i class="bi bi-list"></i></button>
<div class="user-title-wrap">
<div class="user-title-icon"><i class="bi bi-credit-card"></i></div>
<div>
<h1>Member Wallet Listing</h1>
</div>
</div>
<div class="report-actions">
      <button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">
        <i class="bi bi-sun-fill" data-theme-icon="sun"></i>
        <i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i>
      </button>
      <div data-bo-profile></div>
    </div>
</header>
<section class="report-content">
<div class="quick-stats">
<div class="metric"><span>Main Wallet Total</span><strong id="mwMainTotal">0.00</strong></div>
<div class="metric"><span>Provider Wallet Total</span><strong id="mwProviderTotal">0.00</strong></div>
<div class="metric"><span>Total Bet</span><strong id="mwBetTotal">0.00</strong></div>
<div class="metric"><span>Net Win/Loss</span><strong id="mwWinLossTotal">0.00</strong></div>
</div>
<div class="table-card">
<div class="filter-card deposit-inline-filter wallet-inline-filter">
<div class="user-search-grid bo-filter-row">
<div class="field"><label>Search Member</label><input id="walletKeyword" placeholder="Username / name / mobile / referrer"/></div>
<div class="field user-filter-actions wallet-filter-actions"><label> </label><div class="filter-action-row"><button class="clean-btn" id="walletResetBtn" type="button"><i class="bi bi-arrow-clockwise"></i> Reset</button><button class="btn-primary-clean" id="walletSearchBtn" type="button"><i class="bi bi-search"></i> Search</button></div></div>
<select id="walletSize" hidden data-no-rounded="1" aria-hidden="true" tabindex="-1"><option value="-" selected>-</option><option value="10">10</option><option value="20">20</option><option value="50">50</option><option value="100">100</option><option value="All">All</option></select>
</div>
</div>
<div class="table-wrap">
<div class="bo-tx-table-head">
<table class="report-table bo-tx-head-table">
<colgroup>
<col class="mw-col-member"/><col class="mw-col-money"/><col class="mw-col-provider"/><col class="mw-col-money"/><col class="mw-col-money"/><col class="mw-col-money"/><col class="mw-col-money"/><col class="mw-col-money"/><col class="mw-col-money"/><col class="mw-col-money"/><col class="mw-col-money"/><col class="mw-col-winloss"/><col class="mw-col-detail"/><col class="mw-col-detail"/><col class="mw-col-detail"/><col class="mw-col-action"/>
</colgroup>
<thead><tr>
<th class="bo-tx-sortable" data-sort="username" aria-sort="none" scope="col"><button type="button" class="bo-tx-sort-btn"><span class="bo-tx-sort-ico" aria-hidden="true"></span>Member</button></th>
<th class="bo-tx-sortable" data-sort="mainWalletBalance" aria-sort="none" scope="col"><button type="button" class="bo-tx-sort-btn"><span class="bo-tx-sort-ico" aria-hidden="true"></span>Main Balance</button></th>
<th class="bo-tx-sortable" data-sort="providerWalletBalance" aria-sort="none" scope="col"><button type="button" class="bo-tx-sort-btn"><span class="bo-tx-sort-ico" aria-hidden="true"></span>Provider Balance Detail</button></th>
<th class="bo-tx-sortable" data-sort="totalBalance" aria-sort="none" scope="col"><button type="button" class="bo-tx-sort-btn"><span class="bo-tx-sort-ico" aria-hidden="true"></span>Total Balance</button></th>
<th class="bo-tx-sortable" data-sort="totalDeposit" aria-sort="none" scope="col"><button type="button" class="bo-tx-sort-btn"><span class="bo-tx-sort-ico" aria-hidden="true"></span>Total Deposit</button></th>
<th class="bo-tx-sortable" data-sort="totalWithdraw" aria-sort="none" scope="col"><button type="button" class="bo-tx-sort-btn"><span class="bo-tx-sort-ico" aria-hidden="true"></span>Total Withdraw</button></th>
<th class="bo-tx-sortable" data-sort="totalTransferIn" aria-sort="none" scope="col"><button type="button" class="bo-tx-sort-btn"><span class="bo-tx-sort-ico" aria-hidden="true"></span>Transfer In</button></th>
<th class="bo-tx-sortable" data-sort="totalTransferOut" aria-sort="none" scope="col"><button type="button" class="bo-tx-sort-btn"><span class="bo-tx-sort-ico" aria-hidden="true"></span>Transfer Out</button></th>
<th class="bo-tx-sortable" data-sort="totalBet" aria-sort="none" scope="col"><button type="button" class="bo-tx-sort-btn"><span class="bo-tx-sort-ico" aria-hidden="true"></span>Total Bet</button></th>
<th class="bo-tx-sortable" data-sort="totalWin" aria-sort="none" scope="col"><button type="button" class="bo-tx-sort-btn"><span class="bo-tx-sort-ico" aria-hidden="true"></span>Total Win</button></th>
<th class="bo-tx-sortable" data-sort="totalLose" aria-sort="none" scope="col"><button type="button" class="bo-tx-sort-btn"><span class="bo-tx-sort-ico" aria-hidden="true"></span>Total Lose</button></th>
<th class="bo-tx-sortable" data-sort="winLoss" aria-sort="none" scope="col"><button type="button" class="bo-tx-sort-btn"><span class="bo-tx-sort-ico" aria-hidden="true"></span>Win/Loss</button></th>
<th class="bo-tx-sortable" data-sort="totalAdjustment" aria-sort="none" scope="col"><button type="button" class="bo-tx-sort-btn"><span class="bo-tx-sort-ico" aria-hidden="true"></span>Total Adjustment Detail</button></th>
<th class="bo-tx-sortable" data-sort="totalBonus" aria-sort="none" scope="col"><button type="button" class="bo-tx-sort-btn"><span class="bo-tx-sort-ico" aria-hidden="true"></span>Total Bonus Detail</button></th>
<th class="bo-tx-sortable" data-sort="dailyRebate" aria-sort="none" scope="col"><button type="button" class="bo-tx-sort-btn"><span class="bo-tx-sort-ico" aria-hidden="true"></span>Daily Rebate Detail</button></th>
<th scope="col">Action</th>
</tr></thead>
</table>
</div>
<div class="bo-tx-table-body" id="walletTableScroll">
<table class="report-table bo-tx-body-table">
<colgroup>
<col class="mw-col-member"/><col class="mw-col-money"/><col class="mw-col-provider"/><col class="mw-col-money"/><col class="mw-col-money"/><col class="mw-col-money"/><col class="mw-col-money"/><col class="mw-col-money"/><col class="mw-col-money"/><col class="mw-col-money"/><col class="mw-col-money"/><col class="mw-col-winloss"/><col class="mw-col-detail"/><col class="mw-col-detail"/><col class="mw-col-detail"/><col class="mw-col-action"/>
</colgroup>
<tbody id="memberWalletBody"><tr><td colspan="16">Loading...</td></tr></tbody>
</table>
</div>
</div>
<div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
<button class="clean-btn" id="walletPrevBtn" type="button">Previous</button>
<span class="text-muted small" id="walletPager"></span>
<button class="clean-btn" id="walletNextBtn" type="button">Next</button>
</div>
</div>
</section>
</main>
</div>
<div aria-hidden="true" class="modal-clean" hidden="" id="providerWalletDetailModal">
<div class="modal-clean-panel provider-wallet-detail-panel">
<div class="modal-clean-head"><div><h3 id="providerWalletDetailTitle">Provider Wallet Detail</h3><small>Balances still held inside each game provider wallet.</small></div><button class="modal-clean-close" id="providerWalletDetailClose" type="button"><i class="bi bi-x-lg"></i></button></div>
<div class="modal-clean-body provider-wallet-detail-body">
<div class="table-wrap"><table class="report-table"><thead><tr><th>Provider</th><th>Account</th><th>Balance Left</th><th>Status</th><th>Last Updated</th><th>Session</th></tr></thead><tbody id="providerWalletDetailBody"><tr><td colspan="6">Loading...</td></tr></tbody></table></div>
</div>
<div class="modal-clean-foot provider-wallet-detail-foot"><button class="clean-btn" id="providerWalletDetailClose2" type="button">Close</button></div>
</div>
</div>
