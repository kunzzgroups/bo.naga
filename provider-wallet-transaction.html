  try{
    if(localStorage.getItem('bo_theme')==='dark') document.documentElement.setAttribute('data-bo-theme','dark');
  }catch(e){}
})();
</script>
<style>
/* Provider Transactions — Wallet Ledger listing filter metrics (MD locked) */
.provider-transaction-page .table-card > .filter-card.wallet-inline-filter{
  padding:10px 14px!important;
  border:0!important;
  border-bottom:1px solid #EADCC8!important;
  border-radius:0!important;
  background:#FFF8EB!important;
  box-shadow:none!important;
}
html[data-bo-theme="dark"] .provider-transaction-page .table-card > .filter-card.wallet-inline-filter{
  background:#383A46!important;
  border-bottom-color:rgba(255,255,255,.12)!important;
}
@media (min-width:1024px){
  .provider-transaction-page .filter-card .bo-filter-row{
    display:flex!important;
    flex-flow:row wrap!important;
    align-items:flex-end!important;
    gap:10px!important;
    overflow:visible!important;
  }
  .provider-transaction-page .filter-card .bo-filter-row>:has(.bo-range-trigger),
  .provider-transaction-page .filter-card .bo-filter-row>:has(.ref-range-trigger),
  .provider-transaction-page .filter-card .bo-filter-row>.bo-filter-range-item{
    flex:0 0 240px!important;width:240px!important;min-width:220px!important;max-width:240px!important;
  }
  .provider-transaction-page .filter-card .bo-filter-row>.field:has(#txKeyword){
    flex:1 1 280px!important;width:auto!important;min-width:220px!important;max-width:360px!important;
  }
  .provider-transaction-page .filter-card .bo-filter-row>.field:has(#txStatus){
    flex:0 0 150px!important;width:150px!important;min-width:140px!important;max-width:150px!important;
  }
}
@media (max-width:1023.98px){
  .provider-transaction-page .filter-card .bo-filter-row{
    display:grid!important;
    grid-template-columns:1fr 1fr!important;
    gap:10px!important;
  }
  .provider-transaction-page .filter-card .bo-filter-row>.field:has(#txKeyword){grid-column:1 / -1}
}
@media (max-width:575.98px){
  .provider-transaction-page .filter-card .bo-filter-row{grid-template-columns:1fr!important}
}
.provider-transaction-page .report-table.pwt-table{width:100%!important;min-width:1120px!important;table-layout:fixed!important}
/* Beat amber `body.bo-wallet-tx .table-wrap{overflow:hidden}` — scroll lives on wrap
   (Payment Method recipe). Show `-` keeps autofit without vertical scrollbar. */
html body.bo-wallet-tx.provider-transaction-page .report-content.pwt-content{
  display:flex!important;
  flex-direction:column!important;
  min-height:0!important;
  overflow:hidden!important;
}
html body.bo-wallet-tx.provider-transaction-page .table-card{
  display:flex!important;
  flex-direction:column!important;
  flex:1 1 auto!important;
  min-height:0!important;
  overflow:hidden!important;
}
html body.bo-wallet-tx.provider-transaction-page .table-card > .filter-card,
html body.bo-wallet-tx.provider-transaction-page .table-card > .table-footer{
  flex:0 0 auto!important;
}
html body.bo-wallet-tx.provider-transaction-page .table-card > .table-wrap,
html body.bo-wallet-tx.provider-transaction-page.pwt-page .table-card > .table-wrap{
  flex:1 1 0%!important;
  width:100%!important;
  max-width:100%!important;
  min-height:0!important;
  height:auto!important;
  max-height:none!important;
  display:block!important;
  overflow:auto!important;
  overflow-x:auto!important;
  overflow-y:auto!important;
  -webkit-overflow-scrolling:touch;
  border:0!important;
  border-radius:0!important;
  box-shadow:none!important;
}
html body.bo-wallet-tx.provider-transaction-page .table-card[data-bo-autofit] > .table-wrap{
  overflow-y:hidden!important;
}
html body.bo-wallet-tx.provider-transaction-page .table-card > .table-wrap .report-table thead th{
  position:sticky;top:0;z-index:2;
}
html body.bo-wallet-tx.provider-transaction-page .report-table.bo-tx-evenfill tbody td{
  vertical-align:middle!important;
}
.provider-transaction-page .pwt-url{
  display:block!important;max-width:100%!important;overflow:hidden!important;
  text-overflow:ellipsis!important;white-space:nowrap!important;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:600;
}
.provider-transaction-page .pwt-payload-btn{
  height:28px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:700;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
}
.provider-transaction-page .status-pill.is-success{
  background:#DCFCE7;color:#166534;border:1px solid rgba(22,101,52,.2);
}
html[data-bo-theme="dark"] .provider-transaction-page .status-pill.is-success{
  background:rgba(16,185,129,.18);color:#6EE7B7;border-color:rgba(110,231,183,.28);
}

/* Panel pill scrollbar on table wrap */
html body.bo-wallet-tx.provider-transaction-page .table-card > .table-wrap::-webkit-scrollbar{width:6px;height:6px}
html body.bo-wallet-tx.provider-transaction-page .table-card > .table-wrap::-webkit-scrollbar-button{display:none;height:0;width:0}
html body.bo-wallet-tx.provider-transaction-page .table-card > .table-wrap::-webkit-scrollbar-thumb{background:#8B6B4A;border-radius:999px}
html body.bo-wallet-tx.provider-transaction-page .table-card > .table-wrap::-webkit-scrollbar-thumb:hover{background:#5C4A30}
html body.bo-wallet-tx.provider-transaction-page .table-card > .table-wrap::-webkit-scrollbar-track{background:transparent}
html[data-bo-theme="dark"] body.bo-wallet-tx.provider-transaction-page .table-card > .table-wrap::-webkit-scrollbar-thumb{background:#F59E0B}
html[data-bo-theme="dark"] body.bo-wallet-tx.provider-transaction-page .table-card > .table-wrap::-webkit-scrollbar-thumb:hover{background:#D97706}
@supports not selector(::-webkit-scrollbar){
  html body.bo-wallet-tx.provider-transaction-page .table-card > .table-wrap{scrollbar-width:thin;scrollbar-color:#8B6B4A transparent}
  html[data-bo-theme="dark"] body.bo-wallet-tx.provider-transaction-page .table-card > .table-wrap{scrollbar-color:#F59E0B transparent}
}
</style>
</head>
<body class="report-body standardized-listing-page provider-transaction-page pwt-page bo-wallet-tx bo-account-chip">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand">
<div>Backoffice<br/><small>Admin Panel</small></div>
<button class="close-side" data-close-sidebar="" type="button"><i class="bi bi-x-lg"></i></button>
</div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar="" id="reportOverlay"></div>
<main class="report-main">
<header class="report-topbar">
<button class="hamb" data-open-sidebar="" type="button"><i class="bi bi-list"></i></button>
<div class="user-title-wrap">
<div class="user-title-icon"><i class="bi bi-arrow-repeat"></i></div>
<div>
<h1>Provider Transactions</h1>
</div>
</div>
<div class="report-actions">
      <button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">
        <i class="bi bi-sun-fill" data-theme-icon="sun"></i>
        <i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i>
      </button>
      <div data-bo-profile></div>
    </div>
</header>
<section class="report-content pwt-content">
<div class="table-card">
<div class="filter-card deposit-inline-filter wallet-inline-filter">
<div class="user-search-grid bo-filter-row pwt-filter-grid">
<div class="field"><label>From</label><input class="form-control" id="txFrom" type="date"/></div>
<div class="field"><label>To</label><input class="form-control" id="txTo" type="date"/></div>
<div class="field"><label>Search</label><input class="form-control" id="txKeyword" type="search" placeholder="Member ID / Provider / Type" autocomplete="off"/></div>
<div class="field"><label>Status</label><select class="form-select" id="txStatus"><option value="">All Status</option><option>SUCCESS</option><option>FAILED</option><option>PENDING</option></select></div>
</div>
</div>
<div class="table-wrap">
<table class="report-table pwt-table">
<thead>
<tr>
<th>ID</th><th>Member</th><th>Provider</th><th>Type</th><th>Amount</th><th>Status</th><th>HTTP</th><th>API URL</th><th>Created</th><th>Action</th>
</tr>
</thead>
<tbody id="txBody"><tr><td class="text-center py-4" colspan="10">Loading...</td></tr></tbody>
</table>
</div>
<div class="table-footer">
<div class="entries-control">Show <select id="txSize" aria-label="Rows per page"><option value="-" selected>-</option><option value="10">10</option><option value="20">20</option><option value="50">50</option><option value="100">100</option><option value="All">All</option></select> entries</div>
<div class="table-info" id="txPageInfo">Showing 0 to 0 of 0 entries</div>
<div class="pagination-clean" id="txPagination"></div>
</div>
</div>
</section>
</main>
</div>
<div aria-hidden="true" class="modal fade pwt-modal" id="txPayloadModal" tabindex="-1">
<div class="modal-dialog modal-xl modal-dialog-scrollable modal-dialog-centered">
<div class="modal-content">
<div class="modal-header">
<div>
<h5 class="modal-title">Provider API Payload</h5>
<small class="text-muted" id="txPayloadMeta">Request / response debug</small>
</div>
<button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
</div>
<div class="modal-body">
<div class="payload-grid">
<div class="payload-block full"><label>API URL</label><pre class="payload-box" id="txApiUrl"></pre></div>
<div class="payload-block"><label>Request Payload</label><pre class="payload-box" id="txRequestPayload"></pre></div>
<div class="payload-block"><label>Response Payload</label><pre class="payload-box" id="txResponsePayload"></pre></div>
<div class="payload-block full"><label>Request Headers</label><pre class="payload-box" id="txRequestHeaders"></pre></div>
<div class="payload-block full"><label>Signature Plain Text</label><pre class="payload-box" id="txSignaturePlainText"></pre></div>
<div class="payload-block full"><label>Generated Signature</label><pre class="payload-box" id="txGeneratedSignature"></pre></div>
<div class="payload-block full"><label>Exact Raw JSON Used for Signing</label><pre class="payload-box" id="txRawJson"></pre></div>
<div class="payload-block full"><label>Error Message</label><pre class="payload-box error-box" id="txErrorMessage"></pre></div>
<div class="payload-block full debug-json-block">
<div class="debug-json-head">
<label><i class="bi bi-filetype-json"></i> Full Debug JSON</label>
<button class="clean-btn debug-copy-btn" id="txCopyDebugJson" type="button"><i class="bi bi-copy"></i> Copy JSON</button>
</div>
<pre class="payload-box debug-json-box" id="txFullDebugJson">-</pre>
</div>
</div>
</div>
<div class="modal-footer">
<button class="clean-btn" data-bs-dismiss="modal" type="button">Close</button>
</div>
</div>
</div>
</div>

</body>
</html>
