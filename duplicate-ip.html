<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Duplicate IP Checker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="assets/css/reports.css?v=1.0.33" rel="stylesheet" />
  <link href="assets/css/bo-ui-standard.css?v=1.0.1" rel="stylesheet" />
  <link href="assets/css/bo-targeted-fixes.css?v=1.0.0" rel="stylesheet" />
</head>
  <body class="report-body">
    <div class="report-shell">
      <aside class="report-sidebar" id="reportSidebar">
        <div class="report-brand">
          <div>Backoffice<br /><small>Admin Panel</small></div>
          <button class="close-side" data-close-sidebar>
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
        <nav class="report-nav"></nav>
      </aside>
      <div class="sidebar-overlay" data-close-sidebar id="reportOverlay"></div>
      <main class="report-main">
        <header class="report-topbar">
          <button class="hamb" data-open-sidebar>
            <i class="bi bi-list"></i>
          </button>
          <div class="user-title-wrap">
            <div class="user-title-icon"><i class="bi bi-diagram-3"></i></div>
            <div>
              <h1>Duplicate IP Checker</h1>
              <p>Find members sharing the same latest login IP address.</p>
            </div>
          </div>
          <div class="report-actions" data-bo-profile></div>
        </header>
        <section class="report-content">
          <div class="filter-card">
            <div class="user-search-grid bo-filter-row">
              <div class="field">
                <label>Search IP</label
                ><input id="dupIpSearch" placeholder="Example: 1.2.3.4" />
              </div>
              <div class="field user-filter-actions">
                <label>&nbsp;</label>
                <div class="filter-action-row">
                  <button class="clean-btn" id="dupReset">
                    <i class="bi bi-arrow-clockwise"></i> Reset</button
                  ><button class="btn-primary-clean" id="dupSearch">
                    <i class="bi bi-search"></i> Search
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="table-card">
            <div class="user-toolbar mb-3">
              <div class="user-title-row">
                <div class="user-badge">
                  <i class="bi bi-diagram-3"></i><span>Shared Login IPs</span>
                </div>
                <span class="users-found-badge" id="dupCount">0 IPs</span>
              </div>
              <button class="clean-btn" id="dupRefresh">
                <i class="bi bi-arrow-clockwise"></i> Refresh
              </button>
            </div>
            <div class="table-wrap">
              <table class="report-table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>IP Address</th>
                    <th>Users Sharing</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="dupBody">
                  <tr>
                    <td colspan="4">Loading...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
          <div class="table-card mt-4" id="dupUsersCard" hidden>
            <div class="user-toolbar mb-3">
              <div class="user-title-row">
                <div class="user-badge">
                  <i class="bi bi-people"></i
                  ><span id="dupUsersTitle">Users</span>
                </div>
              </div>
            </div>
            <div class="table-wrap">
              <table class="report-table">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Name</th>
                    <th>Mobile</th>
                    <th>Registration IP</th>
                    <th>Last Login IP</th>
                    <th>Last Login</th>
                    <th>Register Date</th>
                  </tr>
                </thead>
                <tbody id="dupUsersBody"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="assets/js/config.js?v=1.0.25"></script>
    <script src="assets/js/reports.js?v=1.0.11"></script>
    <script src="assets/js/auth.js?v=1.0.25"></script>
    <script src="assets/js/duplicate-ip.js?v=1.0.0"></script>
    <script src="assets/js/operation-global-notification.js?v=20260729-2"></script>
  <script src="assets/js/bo-ui-standard.js?v=1.0.0"></script>
</body>
</html>
