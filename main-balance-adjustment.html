<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Balance Adjustment</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="assets/css/reports.css?v=1.0.43" rel="stylesheet" />
    <link href="assets/css/bo-ui-standard.css?v=1.0.3" rel="stylesheet" />
    <link href="assets/css/brand-agent-standard.css?v=1.0.2" rel="stylesheet" />
    <link
      href="assets/css/main-executive-modules.css?v=1.0.0"
      rel="stylesheet"
    />
  </head>
  <body
    class="report-body brand-agent-standard main-mod-page"
    data-access-page="brand_management"
  >
    <div class="report-shell">
      <aside class="report-sidebar" id="reportSidebar">
        <div class="report-brand">
          <div>Backoffice<br /><small>Executive Panel</small></div>
          <button class="close-side" data-close-sidebar>
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
        <nav class="report-nav"></nav>
      </aside>
      <div class="sidebar-overlay" data-close-sidebar></div>
      <main class="report-main">
        <header class="report-topbar">
          <button class="hamb" data-open-sidebar>
            <i class="bi bi-list"></i>
          </button>
          <div></div>
          <div class="report-actions" data-bo-profile></div>
        </header>
        <section class="report-content">
          <a class="main-mod-back" href="main-balance-overview.html"
            ><i class="bi bi-arrow-left"></i>Back to Balance Overview</a
          >
          <div class="main-mod-head">
            <div>
              <h2>Balance Adjustment</h2>
              <p>Adjust brand balance for prepaid or refund scenarios</p>
            </div>
          </div>
          <div class="main-mod-card">
            <div class="main-mod-adjust-head">
              <div><small>Brand</small><b id="adjustBrand">-</b></div>
              <div>
                <small>Current Balance</small><b id="adjustBalance">0.00</b>
              </div>
            </div>
            <div class="main-mod-tabs" style="padding: 0 24px">
              <button class="main-mod-tab active" data-adjust-tab="add">
                Add Adjustment</button
              ><button class="main-mod-tab" data-adjust-tab="history">
                Adjustment History
              </button>
            </div>
            <div class="main-mod-form" data-adjust-panel="add">
              <div class="main-mod-form-grid">
                <div>
                  <label>Amount *</label
                  ><input
                    id="adjustAmount"
                    type="number"
                    min="0.01"
                    step="0.01"
                    placeholder="Enter amount"
                  />
                </div>
                <div>
                  <label>Notes (Optional)</label
                  ><input
                    id="adjustNote"
                    maxlength="200"
                    placeholder="Enter reason for this adjustment"
                  />
                </div>
              </div>
              <div style="margin-top: 18px; display: flex; gap: 10px">
                <select class="main-mod-select" id="adjustAction">
                  <option value="ADD">Add Credit</option>
                  <option value="DEDUCT">Deduct Credit</option></select
                ><button class="main-mod-dark-btn" id="adjustConfirm">
                  Confirm Adjustment
                </button>
              </div>
              <div
                id="adjustMsg"
                class="main-mod-subtitle"
                style="margin-top: 10px"
              ></div>
            </div>
            <div class="main-mod-hidden" data-adjust-panel="history">
              <div class="main-mod-table-title">Recent Adjustment History</div>
              <table class="main-mod-table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Type</th>
                    <th class="main-mod-num">Amount</th>
                    <th>Operator</th>
                    <th>Notes</th>
                  </tr>
                </thead>
                <tbody id="adjustHistoryRows"></tbody>
              </table>
              <div class="main-mod-footer">
                <span id="adjustInfo">Showing 0 results</span>
                <div class="main-mod-pager">
                  <button id="adjustPrev" type="button">
                    <i class="bi bi-chevron-left"></i></button
                  ><button class="active" disabled id="adjustPage">1</button
                  ><button id="adjustNext" type="button">
                    <i class="bi bi-chevron-right"></i>
                  </button>
                </div>
                <select class="main-mod-page-size" id="adjustPageSize">
                  <option value="10">10 / page</option>
                  <option value="20">20 / page</option>
                  <option value="50">50 / page</option>
                </select>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="assets/js/config.js?v=1.0.36"></script>
    <script src="assets/js/brand-context.js?v=1.0.3"></script>
    <script src="assets/js/reports.js?v=1.0.17"></script>
    <script src="assets/js/auth.js?v=1.0.50"></script>
    <script src="assets/js/main-exec-date-range.js?v=1.0.0"></script>
    <script src="assets/js/main-balance-adjustment.js?v=1.0.0"></script>
    <script src="assets/js/bo-ui-standard.js?v=1.0.0"></script>
  </body>
</html>
