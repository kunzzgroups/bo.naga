<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Social Settings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/reports.css?v=1.0.26" rel="stylesheet">
  <link href="assets/css/social.css?v=1.0.0" rel="stylesheet">
</head>
<body class="report-body">
<div class="report-shell">
  <aside class="report-sidebar" id="reportSidebar">
    <div class="report-brand"><div>Backoffice<br><small>Admin Panel</small></div><button class="close-side" data-close-sidebar><i class="bi bi-x-lg"></i></button></div>
    <nav class="report-nav"></nav>
  </aside>
  <div class="sidebar-overlay" id="reportOverlay" data-close-sidebar></div>
  <main class="report-main">
    <header class="report-topbar">
      <button class="hamb" data-open-sidebar><i class="bi bi-list"></i></button>
      <div class="user-title-wrap"><div class="user-title-icon"><i class="bi bi-share"></i></div><div><h1>Social</h1><p>Manage frontend social media destination links.</p></div></div>
      <div class="report-actions" data-bo-profile></div>
    </header>
    <section class="report-content">
      <div class="table-card social-settings-card">
        <div class="social-settings-head"><div><h2>Social Links</h2><p>The existing Facebook and Telegram images remain managed in Site Customize.</p></div></div>
        <div class="social-fields">
          <label class="social-field" for="facebookHref"><span><i class="bi bi-facebook"></i> Facebook href URL</span><input id="facebookHref" type="url" placeholder="https://facebook.com/your-page" autocomplete="url"></label>
          <label class="social-field" for="telegramHref"><span><i class="bi bi-telegram"></i> Telegram href URL</span><input id="telegramHref" type="url" placeholder="https://t.me/your-channel" autocomplete="url"></label>
        </div>
        <div class="social-status" id="socialStatus">Loading current social settings...</div>
        <div class="social-actions"><button class="clean-btn primary" id="saveSocialBtn" type="button"><i class="bi bi-save"></i> Save Setting</button></div>
      </div>
    </section>
  </main>
</div>
<script src="assets/js/config.js?v=1.0.19"></script>
<script src="assets/js/auth.js?v=1.0.18"></script>
<script src="assets/js/reports.js?v=1.0.9"></script>
<script src="assets/js/social.js?v=1.0.0"></script>
</body>
</html>
