<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f3f5f8}.wrap{max-width:1200px;margin:auto;padding:24px}.cardx{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric small{color:#6b7280;display:block}.metric b{font-size:22px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><div class="d-flex justify-content-between align-items-center mb-3"><div><h3 id="agentPortalName">Agent Dashboard</h3><div id="agentPortalCode" class="text-muted"></div></div><button id="agentPortalLogout" class="btn btn-outline-secondary">Logout</button></div><div class="cardx mb-3"><div class="d-flex gap-2 align-items-end"><div><label class="form-label">Month</label><input id="agentPortalMonth" type="month" class="form-control"></div><button id="agentPortalRefresh" class="btn btn-primary">Refresh</button></div></div><div id="agentPortalMetrics" class="grid mb-3"></div><div class="cardx mb-3"><h5>My Players</h5><div class="table-responsive"><table class="table"><thead><tr><th>Username</th><th>Name</th><th>Mobile</th><th>Joined</th></tr></thead><tbody id="agentPortalPlayers"></tbody></table></div></div><div class="cardx"><h5>Wallet Ledger</h5><div class="table-responsive"><table class="table"><thead><tr><th>Time</th><th>Type</th><th>Amount</th><th>Balance</th><th>Remark</th></tr></thead><tbody id="agentPortalLedger"></tbody></table></div></div></div><script src="assets/js/config.js?v=1.0.34"></script><script src="assets/js/agent-portal.js?v=1.0.0"></script></body></html>
