<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/reports.css?v=1.0.43" rel="stylesheet">
<link href="assets/css/bo-ui-standard.css?v=1.0.3" rel="stylesheet">
<link href="assets/css/brand-agent-standard.css?v=1.0.2" rel="stylesheet">
<link href="assets/css/main-dashboard-executive.css?v=2.5.4" rel="stylesheet">
<script>
(function(){
  try{
    if(localStorage.getItem('bo_theme')==='dark') document.documentElement.setAttribute('data-bo-theme','dark');
  }catch(e){}
})();
</script>
</head>
<body class="report-body brand-agent-standard main-dashboard-page" data-access-page="main_dashboard">
<div class="report-shell">
  <aside class="report-sidebar" id="reportSidebar">
    <div class="report-brand">
      <div>Backoffice<br><small>Executive Panel</small></div>
      <button class="close-side" data-close-sidebar><i class="bi bi-x-lg"></i></button>
    </div>
    <nav class="report-nav"></nav>
  </aside>
  <div class="sidebar-overlay" data-close-sidebar></div>
  <main class="report-main">
    <header class="report-topbar">
      <button class="hamb" data-open-sidebar type="button" aria-label="Open menu"><i class="bi bi-list"></i></button>
      <div></div>
      <div class="report-actions">
        <button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">
          <i class="bi bi-sun-fill" data-theme-icon="sun"></i>
          <i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i>
        </button>
        <div data-bo-profile></div>
      </div>
    </header>
    <section class="main-exec" id="mainExec">
      <div class="overview-head">
        <div class="overview-copy">
          <h1 class="overview-title">Overview</h1>
          <p class="overview-sub">Real-time revenue attribution and profit growth analytics</p>
        </div>
        <div class="main-exec-date-field ref-date-field">
          <div class="ref-range-wrap">
            <button class="ref-range-trigger" id="mainDateTrigger" type="button">
              <span class="ref-range-icon"><i class="bi bi-calendar3"></i></span>
              <span id="mainDateLabel">Select date range</span>
              <i class="bi bi-chevron-down ms-auto"></i>
            </button>
            <input id="mainFrom" type="hidden">
            <input id="mainTo" type="hidden">
            <div class="ref-range-picker" id="mainRangePicker">
              <div class="ref-range-presets">
                <button type="button" data-range-preset="today">Today</button>
                <button type="button" data-range-preset="yesterday">Yesterday</button>
                <button type="button" data-range-preset="thisWeek">This Week</button>
                <button type="button" data-range-preset="lastWeek">Last Week</button>
                <button type="button" data-range-preset="thisMonth">This Month</button>
                <button type="button" data-range-preset="lastMonth">Last Month</button>
                <button type="button" data-range-preset="thisYear">This Year</button>
                <button type="button" data-range-preset="lastYear">Last Year</button>
              </div>
              <div class="ref-range-calendar">
                <div class="ref-cal-head">
                  <button type="button" id="mainCalPrev"><i class="bi bi-chevron-left"></i></button>
                  <button type="button" class="ref-head-pick" id="mainCalMonth"></button>
                  <button type="button" class="ref-head-pick" id="mainCalYear"></button>
                  <button type="button" id="mainCalNext"><i class="bi bi-chevron-right"></i></button>
                </div>
                <div class="ref-cal-month-grid" id="mainCalMonthGrid"></div>
                <div class="ref-cal-year-grid" id="mainCalYearGrid"></div>
                <div class="ref-cal-day-view" id="mainCalDayView">
                  <div class="ref-cal-week"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
                  <div class="ref-cal-days" id="mainCalDays"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="profit-kpis">
        <a class="profit-card merchant-card" href="merchant-profit.html">
          <div class="profit-main">
            <span class="profit-icon merchant"><i class="bi bi-shop-window"></i></span>
            <div class="profit-copy">
              <div class="profit-label">Merchant Profit</div>
              <div class="profit-value"><span id="merchantProfit">0.00</span> <small class="currency-unit">MYR</small></div>
            </div>
            <div class="profit-spark" id="merchantSpark" aria-hidden="true"></div>
          </div>
          <div class="profit-rule" aria-hidden="true"></div>
          <div class="profit-delta" id="merchantDelta">—</div>
        </a>
        <div class="profit-card game-card">
          <div class="profit-main">
            <span class="profit-icon game"><i class="bi bi-database"></i></span>
            <div class="profit-copy">
              <div class="profit-label">Game Profit</div>
              <div class="profit-value"><span id="gameProfit">0.00</span> <small class="currency-unit">MYR</small></div>
            </div>
            <div class="profit-spark" id="gameSpark" aria-hidden="true"></div>
          </div>
          <div class="profit-rule" aria-hidden="true"></div>
          <div class="profit-delta" id="gameDelta">—</div>
        </div>
        <div class="profit-card net-card">
          <div class="profit-main">
            <span class="profit-icon net"><i class="bi bi-graph-up-arrow"></i></span>
            <div class="profit-copy">
              <div class="profit-label">Net Profit</div>
              <div class="profit-value"><span id="netProfit">0.00</span> <small class="currency-unit">MYR</small></div>
            </div>
            <div class="profit-spark" id="netSpark" aria-hidden="true"></div>
          </div>
          <div class="profit-rule" aria-hidden="true"></div>
          <div class="profit-delta" id="netDelta">—</div>
        </div>
      </div>
      <div class="trend-card">
        <div class="trend-head">
          <div class="trend-copy">
            <div class="trend-heading">Profit Trend</div>
            <p class="trend-sub">Performance over selected period</p>
          </div>
          <div class="trend-legend">
            <span id="legendMerchant"><i class="swatch merchant"></i>Merchant Profit</span>
            <span id="legendGame"><i class="swatch game"></i>Game Profit</span>
            <span id="legendNet"><i class="swatch net"></i>Net Profit</span>
          </div>
        </div>
        <div class="trend-chart-wrap" id="profitTrend"><div class="exec-empty">Loading chart...</div></div>
      </div>
    </section>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js?v=1.0.36"></script>
<script src="assets/js/brand-context.js?v=1.0.4"></script>
<script src="assets/js/reports.js?v=1.0.17"></script>
<script src="assets/js/auth.js?v=1.0.51"></script>
<script src="assets/js/bo-date-range.js?v=1.0.15"></script>
<script src="assets/js/main-dashboard.js?v=2.6.3"></script>
<script src="assets/js/bo-ui-standard.js?v=1.0.0"></script>
</body>
</html>
