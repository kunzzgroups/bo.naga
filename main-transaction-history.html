<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transaction History</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="assets/css/reports.css?v=1.0.43" rel="stylesheet"><link href="assets/css/bo-ui-standard.css?v=1.0.2" rel="stylesheet"><link href="assets/css/brand-agent-standard.css?v=1.0.2" rel="stylesheet"><link href="assets/css/main-executive-modules.css?v=1.0.0" rel="stylesheet"></head><body class="report-body brand-agent-standard main-mod-page" data-access-page="main_accounting_report"><div class="report-shell"><aside class="report-sidebar" id="reportSidebar"><div class="report-brand"><div>Backoffice<br><small>Executive Panel</small></div><button class="close-side" data-close-sidebar><i class="bi bi-x-lg"></i></button></div><nav class="report-nav"></nav></aside><div class="sidebar-overlay" data-close-sidebar></div><main class="report-main"><header class="report-topbar"><button class="hamb" data-open-sidebar><i class="bi bi-list"></i></button><div></div><div class="report-actions" data-bo-profile></div></header><section class="report-content"><div class="main-mod-head"><div><h2>Transaction History</h2><p>View all financial transactions and adjustments</p></div><div class="main-mod-actions"><button class="main-mod-dark-btn" id="txExport"><i class="bi bi-download me-2"></i>Export</button></div></div><div class="main-mod-filters"><div class="main-mod-date ref-date-field"><input type="hidden" id="txHistoryFrom"><input type="hidden" id="txHistoryTo"><div class="ref-range-wrap"><button class="ref-range-trigger" id="txHistoryDateTrigger" type="button"><span class="ref-range-icon"><i class="bi bi-calendar3"></i></span><span id="txHistoryDateLabel">Select date range</span><i class="bi bi-chevron-down ms-auto"></i
