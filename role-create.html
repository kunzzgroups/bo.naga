<body class="report-body standardized-listing-page main-admin-role-create-page bo-charcoal bo-account-chip bo-access-control" data-access-page="role">
<div class="report-shell">
<aside class="report-sidebar" id="reportSidebar">
<div class="report-brand"><div>Backoffice<br/><small>Admin Panel</small></div><button class="close-side" data-close-sidebar=""><i class="bi bi-x-lg"></i></button></div>
<nav class="report-nav"></nav>
</aside>
<div class="sidebar-overlay" data-close-sidebar="" id="reportOverlay"></div>
<main class="report-main">
<header class="report-topbar"><button class="hamb" data-open-sidebar=""><i class="bi bi-list"></i></button>
<div class="user-title-wrap"><div class="user-title-icon"><i class="bi bi-person-badge"></i></div><div class="user-title-block"><h1 id="rcPageTitle">Add Permission Group</h1></div></div>
<div class="report-actions">
      <button type="button" class="bo-theme-btn" id="boThemeToggle" aria-pressed="false" title="Switch to dark mode" aria-label="Switch to dark mode">
        <i class="bi bi-sun-fill" data-theme-icon="sun"></i>
        <i class="bi bi-moon-fill" data-theme-icon="moon" hidden></i>
      </button>
      <div data-bo-profile></div>
    </div>
</header>
<section class="report-content mac-workspace">
<form class="mac-form" id="accessForm" novalidate>
<section class="mac-section">
<span class="mac-section-icon"><i class="bi bi-shield-plus"></i></span>
<h2 class="mac-section-title">Group</h2>
<p class="mac-section-help">Name the permission group. Its code and type are derived by the system.</p>
<label class="mac-field"><span class="mac-label">Group Name <b>*</b></span>
<input class="form-control" id="name" placeholder="Example: Finance Manager" autocomplete="off" /></label>
<input type="hidden" id="roleEditId" /><input type="hidden" id="roleEditCode" />
</section>
<section class="mac-section">
<span class="mac-section-icon"><i class="bi bi-list-check"></i></span>
<h2 class="mac-section-title">Menu Permission</h2>
<p class="mac-section-help">Select the menus this group can access.</p>
<div class="rc-perm-chips">
<button class="clean-btn" type="button" id="selectAllPermission"><i class="bi bi-check2-square"></i> Select All</button>
<button class="clean-btn" type="button" id="clearAllPermission"><i class="bi bi-square"></i> Clear</button>
</div>
<div class="permission-groups" id="checkList"></div>
</section>
<div class="upload-status mb-3" id="accessStatus"></div>
<footer class="mac-footer-actions">
<a class="mad-btn mad-btn-ghost" href="role.html"><i class="bi bi-arrow-left"></i> Cancel</a>
<button class="mad-btn mad-btn-primary" type="submit" id="rcSubmit"><i class="bi bi-check2"></i> Save Group</button>
</footer>
</form>
</section>
</main>
</div>
<!-- edit mode reuses the listing's own openEditRole path: the delegated handler in
     access-management.js listens for [data-edit-role], so the page triggers it. -->
<!-- The edit path resolves the role from the listing's own cache, which is filled by
     loadRoleList(); that returns early without #accessTableBody, and it also writes an
     UNGUARDED #roleCountBadge. Both are provided here, hidden, so the page reuses the
     listing's prefill / protected-role checks instead of duplicating them. -->
<table hidden aria-hidden="true"><tbody id="accessTableBody"></tbody></table>
<div id="roleMobileCards" hidden aria-hidden="true"></div>
<span id="roleCountBadge" hidden aria-hidden="true"></span>
<button type="button" data-edit-role="" id="rcEditTrigger" hidden aria-hidden="true"></button>
